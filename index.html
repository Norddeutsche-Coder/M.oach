<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marathon-Coach 2:45</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e6eb;--ac:#e8590c;--easy:#3b82f6;--q:#e8590c;--long:#7c3aed;--race:#dc2626;--ok:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eceef2;--mu:#9aa1ad;--bd:#2c3038;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eceef2;--mu:#9aa1ad;--bd:#2c3038;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:1.3rem;margin:0}h3{margin:0 0 4px}.mu,small{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.st,.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:1.25rem}.st span{font-size:.75rem;color:var(--mu)}
.banner{background:var(--card);border-left:4px solid var(--ac);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.9rem}
.tabs{display:flex;gap:6px;margin-bottom:10px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.mh b{flex:1;text-align:center;text-transform:capitalize}
.g{display:grid;grid-template-columns:repeat(7,1fr) 46px;gap:3px}
.dh{text-align:center;font-size:.7rem;color:var(--mu)}
.c{min-height:66px;border:1px solid var(--bd);border-top:3px solid var(--bd);border-radius:6px;background:var(--card);padding:2px 4px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;font-size:.65rem;line-height:1.25}
.c.out{opacity:.4}.c.tod{outline:2px solid var(--tx)}
.t-easy{border-top-color:var(--easy)}.t-q{border-top-color:var(--q)}.t-long{border-top-color:var(--long)}.t-race{border-top-color:var(--race)}
.c .n{font-weight:700;font-size:.72rem}.c .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c .k{color:var(--mu)}
.c.dn{background:color-mix(in srgb,var(--ok) 16%,var(--card))}.ck{color:var(--ok);font-weight:700}
.sm{display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;font-size:.8rem}
.pl{border-left:4px solid var(--bd);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px}
.pl.t-easy{border-color:var(--easy)}.pl.t-q{border-color:var(--q)}.pl.t-long{border-color:var(--long)}.pl.t-race{border-color:var(--race)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.modal[hidden],[hidden]{display:none!important}
.modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
label{display:flex;flex-direction:column;font-size:.78rem;color:var(--mu);gap:2px}label.row{flex-direction:row;align-items:center;gap:8px;font-size:.95rem;color:var(--tx)}
label input{width:100%}.row input{width:auto}
.b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:8px;border-radius:4px;background:var(--bd);margin:2px 0;overflow:hidden}.bar i{display:block;height:100%}
.card{margin-bottom:10px}.card h3{font-size:1rem}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--mu);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px}
</style></head><body><div class="wrap">
<header><h1>🏃 Marathon-Coach</h1><div class="mu"><span id="cd"></span> · <span id="sy">lokal</span></div></header>
<div class="stats" id="stats"></div><div class="banner" id="ad"></div>
<nav class="tabs"><button data-t="cal" class="on">Kalender</button><button data-t="perf">Leistung</button><button data-t="set">Einstellungen</button></nav>
<section id="cal"></section><section id="perf" hidden></section><section id="set" hidden></section>
<div id="md" class="modal" hidden></div></div>
<script>
const D=864e5,A=[[49,15],[48,35],[47,50],[40,70],[37,66],[29,78],[22,90],[21,86],[20,70],[16,90],[5,120],[3,96],[2,72],[1,50],[0,45]];
const START=new Date(2026,9,12),$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),mon=d=>addD(d,-((d.getDay()+6)%7));
const fp=s=>{s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
const ft=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=x=>Math.round(x*10)/10;
let S={race:'2027-09-26',goal:9900,base:11400,res:[],log:{}};
try{const x=localStorage.getItem('mplan2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
let ICU={id:'',key:''};
try{const x=localStorage.getItem('mplan_icu');if(x)ICU=JSON.parse(x)}catch(e){}
const setSync=t=>{const e=$('#sy');if(e)e.textContent=t};
const store=()=>{try{localStorage.setItem('mplan2',JSON.stringify(S))}catch(e){}};
const save=()=>store();
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const wtr=d=>Math.round((mon(parse(S.race))-mon(d))/(7*D));
const ph=w=>w>=48?'Regeneration':w>=38?'Grundlagen':w>=30?'Tempoentwicklung':w>=21?'Schwelle & Test':w>=17?'Entlastung + Basis':w>=4?'Marathonspezifisch':'Tapering';
function vol(w){if(w>=49)return 15;if(w<=0)return 45;for(let i=0;i<A.length-1;i++){const[a,x]=A[i],[b,y]=A[i+1];if(w<=a&&w>=b)return a==b?x:y+(x-y)*(w-b)/(a-b)}return 45}
const gp=()=>S.goal/42.195;
function expP(d){const b=S.base/42.195,e=addD(mon(parse(S.race)),-35),f=Math.max(0,Math.min(1,(d-START)/(e-START)));return b+(gp()-b)*f}
function fitP(){let b=null;for(const r of S.res){const p=r.sec*Math.pow(42.195/r.km,1.06)/42.195;if(!b||r.d>=b.d)b={d:r.d,p}}return b}
function Z(d){const f=fitP();let P=f?f.p:expP(d);P=Math.max(P,gp());return{mp:P,e1:P*1.16,e2:P*1.3,t:P*.945,i:P*.91,r:P*.87}}
let AD={f:1,msg:'Noch zu wenig Daten – trage deine Läufe ein, dann passt sich der Plan an.'};
function calcAd(){let pl=0,ac=0,rs=[],n=0;AD={f:1,msg:AD.msg};
 for(let i=1;i<=14;i++){const d=addD(today,-i);if(d<START)break;const p=plan(d,1),l=S.log[iso(d)];if(p&&p.km)pl+=p.km;if(l&&l.done){n++;ac+=+l.km||0;if(l.rpe&&i<=7)rs.push(+l.rpe)}}
 if(n<3||pl<20){AD={f:1,msg:'Noch zu wenig Daten – trage mindestens 3 Läufe ein, dann passt sich der Plan an.'};return}
 const c=ac/pl,rp=rs.length?rs.reduce((a,b)=>a+b)/rs.length:0;
 if(rp>=8)AD={f:.85,msg:`Hohe Belastung (RPE Ø ${rp.toFixed(1)}) → Umfang der nächsten 14 Tage −15 %.`};
 else if(c<.8)AD={f:.9,msg:`Nur ${Math.round(c*100)} % des Plan-Umfangs der letzten 14 Tage geschafft → nächste 14 Tage −10 %.`};
 else AD={f:1,msg:`Plan wird gut umgesetzt (${Math.round(c*100)} % Umfang) – keine Anpassung nötig.`}}
function plan(d,na){
 if(d<START)return null;const rd=parse(S.race);if(d>rd)return null;
 const w=wtr(d),dw=(d.getDay()+6)%7,z=Z(d),r=fp;
 if(iso(d)==S.race)return{t:'race',lab:'MARATHON',km:42.2,d:`Renntag! Ziel ${ft(S.goal)} (${r(gp())}/km). Erste 10 km kontrolliert bei ca. ${r(gp()*1.02)}/km.`};
 let V=vol(w);if(w>5&&w<47&&w!=21&&w!=20&&(49-w)%4==3)V*=.78;
 if(!na&&d>=today&&d<=addD(today,13))V*=AD.f;
 const rest={t:'rest',lab:'Recovery',km:0,d:'Ruhetag. Optional 15 min Mobility.'};
 const str=(dw==2||dw==4)&&w<=47?'Kraft zu Hause 20–25 min: einbeinige Kniebeuge, Hip Thrust, Wadenheben, Plank':'';
 const easy=(k,x)=>({t:'easy',lab:'Locker',km:k,str,d:`${k} km locker @ ${r(z.e1)}–${r(z.e2)} /km${x||''}${V>=100&&k>=14?' · Doppeleinheit möglich (AM/PM)':''}`});
 if(dw==0)return rest;
 if(w>=49){if(dw==2||dw==4)return easy(6);if(dw==6)return{t:'long',lab:'Locker',km:8,d:'8 km ganz locker, Regenerationswoche.'};return rest}
 let L=V<30?Math.round(V*.25):Math.min(34,Math.round(V*.285));
 if(w==3)L=24;if(w==2)L=18;if(w==1)L=14;
 const km=dw==6?L:Math.round(Math.max(0,V-L)*[0,.21,.24,.22,.16,.17][dw]);
 const Q=(l,k,t)=>({t:'q',lab:l,km:k,str,d:`${k} km gesamt: ${t}`});
 if(dw==2||dw==5)return easy(km);
 if(dw==4)return easy(km,' + 6 × 20 s Steigerungsläufe');
 if(dw==1||dw==3){const a=dw==1;
  if(w>=48||w==20)return easy(km);
  if(w>=38)return a?Q('Hügel',km,'locker, davon 8 × 60 s bergauf kräftig (Trabpause)'):Q('Fahrtspiel',km,`6 × 2 min zügig (${r(z.t)}), je 2 min locker`);
  if(w>=30){const n=6+(37-w)%3;return a?Q('Intervalle',km,`Einlaufen + ${n} × 1000 m @ ${r(z.i)} (90 s Pause)`):Q('Tempo',km,`20 min @ ${r(z.t)} (Schwelle) im Lauf`)}
  if(w>=21)return a?Q('Schwelle',km,`4 × 2 km @ ${r(z.t)} (2 min Pause)`):Q('Tempo-DL',km,`${Math.min(km-4,8+29-w,14)} km @ ${r(z.t)}`);
  if(w>=17)return a?Q('Intervalle',km,`5 × 1000 m @ ${r(z.i)} (90 s Pause)`):Q('Tempo-DL',km,`${Math.min(10,km-4)} km @ ${r(z.t)}`);
  if(w>=4){const m=Math.max(10,Math.min(20,Math.round(8+(16-w)*1.1)));return a?Q('MRT-Block',km,`${Math.min(m,km-4)} km @ ${r(z.mp)} in 2–3 Blöcken (1 km locker dazwischen)`):Q('Schwelle',km,`3 × 3 km @ ${r(z.t)} (2 min Pause)`)}
  if(w>=1)return a?Q('MRT',km,`${w==3?10:8} km @ ${r(z.mp)}`):Q('Schärfe',km,`5 × 1000 m @ ${r(z.i)}`);
  return a?Q('Aktivierung',km,`3 × 2 min @ ${r(z.mp)}`):easy(km,' + Steigerungsläufe')}
 if(w==21)return{t:'race',lab:'Testlauf',km:15,d:`Testwettkampf 10 km (Ziel ca. ${ft(S.goal*Math.pow(10/42.195,1.06))}) plus Ein-/Auslaufen. Ergebnis unter „Leistung“ eintragen – danach passen sich alle Paces an.`};
 if(w>=48||w==20)return{t:'long',lab:'Longrun',km:L,d:`${L} km locker @ ${r(z.e1)}–${r(z.e2)}`};
 if(w>=4&&w<=16&&w%2==0){const m=Math.max(8,Math.min(22,Math.round(L*.55)));return{t:'long',lab:'Longrun MRT',km:L,d:`${L} km: locker, die letzten ${m} km @ ${r(z.mp)}`}}
 return{t:'long',lab:'Longrun',km:L,d:`${L} km @ ${r(z.e1)}–${r(z.e2)}${L>=28?' · Verpflegung üben':''}`}}
let M=new Date(today.getFullYear(),today.getMonth(),1);
function rCal(){
 const end=new Date(M.getFullYear(),M.getMonth()+1,0);
 let h=`<div class="mh"><button id="pv">‹</button><b>${M.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button id="nx">›</button><button id="td">Heute</button></div><div class="g">`+['Mo','Di','Mi','Do','Fr','Sa','So','Σ km'].map(x=>`<div class="dh">${x}</div>`).join('');
 for(let ws=mon(M);ws<=end;ws=addD(ws,7)){let pl=0,ac=0,c='';
  for(let i=0;i<7;i++){const d=addD(ws,i),p=plan(d),l=S.log[iso(d)],dn=l&&l.done;if(p)pl+=p.km;if(dn)ac+=+l.km||0;
   c+=`<div class="c ${p?'t-'+p.t:''} ${dn?'dn':''} ${d.getMonth()!=M.getMonth()?'out':''} ${+d==+today?'tod':''}" data-d="${iso(d)}"><span class="n">${d.getDate()}</span>${p?`<span class="l">${p.lab}</span><span class="k">${p.km?r1(p.km)+' km':''}</span>`:''}${dn?`<span class="ck">✓ ${esc(l.km)}</span>`:''}</div>`}
  h+=c+`<div class="sm">${Math.round(pl)}<small>${ac?Math.round(ac)+'✓':''}</small></div>`}
 h+=`</div><div class="leg"><span><i style="background:var(--easy)"></i>Locker</span><span><i style="background:var(--q)"></i>Qualität</span><span><i style="background:var(--long)"></i>Longrun</span><span><i style="background:var(--race)"></i>Wettkampf</span><span>Tippe auf einen Tag zum Eintragen</span></div>`;
 $('#cal').innerHTML=h;
 $('#pv').onclick=()=>{M=new Date(M.getFullYear(),M.getMonth()-1,1);rCal()};
 $('#nx').onclick=()=>{M=new Date(M.getFullYear(),M.getMonth()+1,1);rCal()};
 $('#td').onclick=()=>{M=new Date(today.getFullYear(),today.getMonth(),1);rCal()};
 document.querySelectorAll('.c').forEach(e=>e.onclick=()=>openM(e.dataset.d))}
function openM(k){
 const d=parse(k),p=plan(d),l=S.log[k]||{},m=$('#md');m.hidden=false;
 m.innerHTML=`<div class="box"><h3>${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="mu">${ph(wtr(d))} · ${Math.max(0,wtr(d))} Wochen bis zur Rennwoche</div>${p?`<div class="pl t-${p.t}"><b>${p.lab}${p.km?' · '+r1(p.km)+' km':''}</b><br>${p.d}${p.str?'<br>💪 '+p.str:''}</div>`:'<p>Kein Plan für diesen Tag.</p>'}
 <label class="row"><input type="checkbox" id="fd" ${l.done?'checked':''}> Erledigt</label>
 <div class="f"><label>Distanz (km)<input id="fk" type="number" step="0.1" value="${l.km!=null?esc(l.km):(p?r1(p.km):'')}"></label><label>Dauer (min)<input id="fm" type="number" value="${esc(l.min)}"></label><label>Anstrengung 1–10<input id="fr" type="number" min="1" max="10" value="${esc(l.rpe)}"></label></div>
 <label>Notiz<input id="fn" value="${esc(l.note)}"></label>
 <div class="b"><button class="pri" id="sv">Speichern</button><button id="dl">Löschen</button><button id="cl">Schließen</button></div></div>`;
 $('#sv').onclick=()=>{S.log[k]={done:$('#fd').checked,km:$('#fk').value,min:$('#fm').value,rpe:$('#fr').value,note:$('#fn').value};save();m.hidden=true;render()};
 $('#dl').onclick=()=>{delete S.log[k];save();m.hidden=true;render()};
 $('#cl').onclick=()=>m.hidden=true}
function rPerf(){
 const z=Z(today),f=fitP();
 const dist=[[5,'5 km'],[10,'10 km'],[21.0975,'Halbmarathon'],[42.195,'Marathon']];
 let wk='';for(let i=9;i>=0;i--){const ws=addD(mon(today),-7*i);if(ws<START)continue;let pl=0,ac=0;for(let j=0;j<7;j++){const d=addD(ws,j),p=plan(d,1),l=S.log[iso(d)];if(p)pl+=p.km;if(l&&l.done)ac+=+l.km||0}
  wk+=`<div style="font-size:.78rem">${ws.toLocaleDateString('de-DE',{day:'numeric',month:'short'})}: ${Math.round(ac)} / ${Math.round(pl)} km<div class="bar"><i style="width:${Math.min(100,pl/1.2)}%;background:var(--bd);filter:brightness(.8)"></i></div><div class="bar"><i style="width:${Math.min(100,ac/1.2)}%;background:var(--ok)"></i></div></div>`}
 $('#perf').innerHTML=`<div class="card"><h3>Neues Ergebnis (Wettkampf oder Test)</h3><div class="f"><label>Datum<input id="rd" type="date" value="${iso(today)}"></label><label>Distanz<select id="rk">${dist.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></label><label>Std<input id="rh" type="number" min="0" value="0"></label><label>Min<input id="rm" type="number" min="0" value="0"></label><label>Sek<input id="rs" type="number" min="0" value="0"></label></div><button class="pri" id="ra">Hinzufügen</button>
 <table style="margin-top:10px">${S.res.map((x,i)=>`<tr><td>${x.d}</td><td>${r1(x.km)} km</td><td>${ft(x.sec)}</td><td>→ Marathon ${ft(x.sec*Math.pow(42.195/x.km,1.06))}</td><td><button data-x="${i}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Noch keine Ergebnisse – Paces basieren auf dem Plan-Verlauf von 3:10 h Richtung Ziel.</td></tr>'}</table></div>
 <div class="card"><h3>Deine aktuellen Trainingspaces</h3><table><tr><td>Marathontempo</td><td><b>${fp(z.mp)}</b> /km</td></tr><tr><td>Locker</td><td>${fp(z.e1)}–${fp(z.e2)} /km</td></tr><tr><td>Schwelle</td><td>${fp(z.t)} /km</td></tr><tr><td>Intervall 3–5 min</td><td>${fp(z.i)} /km</td></tr><tr><td>Kurz 200–400 m</td><td>${fp(z.r)} /km</td></tr></table><small>${f?'Berechnet aus deinem letzten Ergebnis ('+f.d+').':'Noch ohne Testergebnis; gedeckelt auf Zielpace.'}</small></div>
 <div class="card"><h3>Umfang pro Woche (grün = gelaufen)</h3>${wk||'<span class="mu">Noch keine Wochen.</span>'}</div>`;
 $('#ra').onclick=()=>{const sec=(+$('#rh').value)*3600+(+$('#rm').value)*60+(+$('#rs').value);if(!sec||!$('#rd').value)return;S.res.push({d:$('#rd').value,km:+$('#rk').value,sec});S.res.sort((a,b)=>a.d<b.d?-1:1);save();render()};
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.res.splice(+b.dataset.x,1);save();render()})}
function rSet(){
 const g=S.goal,b=S.base;
 $('#set').innerHTML=`<div class="card"><h3>Intervals.icu</h3><div class="f"><label>Athlete-ID (z. B. i12345)<input id="ia" value="${esc(ICU.id)}"></label><label>API-Schlüssel<input id="ik" type="password" value="${esc(ICU.key)}"></label></div><div class="b"><button class="pri" id="isv">Verbinden &amp; synchronisieren</button></div><p class="mu">ID und Schlüssel werden nur in diesem Browser gespeichert (nie im Repository). Du findest beides in Intervals.icu unter Einstellungen → Entwicklereinstellungen/API.</p></div><div class="card"><h3>Einstellungen</h3><div class="f"><label>Renndatum<input id="sr" type="date" value="${S.race}"></label><label>Ziel Std<input id="gh" type="number" value="${Math.floor(g/3600)}"></label><label>Ziel Min<input id="gm" type="number" value="${Math.floor(g%3600/60)}"></label><label>Bisher Std<input id="bh" type="number" value="${Math.floor(b/3600)}"></label><label>Bisher Min<input id="bm" type="number" value="${Math.floor(b%3600/60)}"></label></div><div class="b"><button class="pri" id="ss">Speichern</button><button id="rs2">Alles zurücksetzen</button></div><p class="mu">Läufe kommen automatisch aus Intervals.icu. Testergebnisse, Einstellungen und Notizen liegen lokal in diesem Browser (pro Gerät). Ändere das Renndatum, falls du in Berlin keinen Startplatz bekommst – der Plan verschiebt sich mit.</p></div>`;
 $('#isv').onclick=()=>{ICU={id:$('#ia').value.trim(),key:$('#ik').value.trim()};try{localStorage.setItem('mplan_icu',JSON.stringify(ICU))}catch(e){}icuSync()};$('#ss').onclick=()=>{S.race=$('#sr').value||S.race;S.goal=(+$('#gh').value*60+ +$('#gm').value)*60;S.base=(+$('#bh').value*60+ +$('#bm').value)*60;save();render()};
 let armed=0;$('#rs2').onclick=e=>{if(!armed){armed=1;e.target.textContent='Wirklich löschen? Nochmal tippen'}else{S={race:'2027-09-26',goal:9900,base:11400,res:[],log:{}};save();render()}}}
function render(){
 calcAd();
 const days=Math.round((parse(S.race)-today)/D),f=fitP(),w=wtr(today),ws=mon(today);let pl=0,ac=0;
 for(let i=0;i<7;i++){const d=addD(ws,i),p=plan(d),l=S.log[iso(d)];if(p)pl+=p.km;if(l&&l.done)ac+=+l.km||0}
 $('#cd').textContent=days>=0?`Rennen in ${days} Tagen (${Math.floor(days/7)} Wochen)`:'Rennen vorbei';
 $('#stats').innerHTML=`<div class="st"><span>Marathon-Prognose</span><b>${ft(f?f.p*42.195:S.base)}</b><span>${f?'aus Ergebnis '+f.d:'Ausgangswert'}</span></div><div class="st"><span>Trainings-Marathontempo</span><b>${fp(Z(today).mp)}/km</b><span>Ziel ${fp(gp())}/km (${ft(S.goal)})</span></div><div class="st"><span>Diese Woche</span><b>${Math.round(ac)} / ${Math.round(pl)} km</b><span>gelaufen / geplant</span></div><div class="st"><span>Phase</span><b>${days<0?'–':ph(w)}</b><span>Wochen bis Rennwoche: ${Math.max(0,w)}</span></div>`;
 let course='';if(f){const diff=f.p*42.195-expP(today)*42.195;course=diff<=0?` Prognose liegt ${fp(-diff)} min vor dem Plan-Verlauf.`:` Prognose liegt ${fp(diff)} min hinter dem Plan-Verlauf${diff>600?' – ein Zwischenziel (z. B. 2:50) wäre realistischer':''}.`}
 $('#ad').textContent='🔄 '+AD.msg+course;
 rCal();rPerf();rSet()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));['cal','perf','set'].forEach(id=>$('#'+id).hidden=id!=b.dataset.t)});

async function icuSync(){
 if(!ICU.id||!ICU.key){setSync('Intervals.icu nicht verbunden – unter „Einstellungen“ verbinden');return}
 setSync('⏳ lädt Läufe…');
 try{
  const u='https://intervals.icu/api/v1/athlete/'+encodeURIComponent(ICU.id)+'/activities?oldest='+iso(START)+'&newest='+iso(today);
  const r=await fetch(u,{headers:{Authorization:'Basic '+btoa('API_KEY:'+ICU.key)}});
  if(r.status==401||r.status==403)throw new Error('Zugang abgelehnt (ID/Schlüssel prüfen)');
  if(!r.ok)throw new Error('Fehler '+r.status);
  const acts=await r.json(),by={};
  for(const a of acts){if(!/Run/.test(a.type||''))continue;const k=(a.start_date_local||'').slice(0,10);if(!k)continue;
   const b=by[k]||(by[k]={km:0,min:0,rpe:0});b.km+=(a.distance||0)/1000;b.min+=(a.moving_time||0)/60;b.rpe=Math.max(b.rpe,a.icu_rpe||(a.feel?a.feel*2:0))}
  let n=0;
  for(const k in by){const o=S.log[k]||{},b=by[k];S.log[k]={done:true,km:r1(b.km),min:Math.round(b.min),rpe:o.rpe||(b.rpe?String(b.rpe):''),note:o.note||'Intervals.icu'};n++}
  save();render();setSync('✅ '+n+' Lauftage synchronisiert · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSync('⚠️ '+(e.message||'Sync fehlgeschlagen'))}}
$('#sy').style.cursor='pointer';$('#sy').onclick=icuSync;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)icuSync()});
icuSync();
</script></body></html>
