<script>

 if(n<3||pl<20){AD={f:1,msg:'Noch zu wenig Daten – trage mindestens 3 Läufe ein, dann passt sich der Plan an.'};return}

function planM(d,na,C){
 const dw=(d.getDay()+6)%7,ro=C.roles[dw],z=Z(d),r=fp,wk=Math.round((mon(d)-mon(START))/(7*D)),dl=wk%4==3;

function planCur(d,na){
 if(d<START)return null;const rd=parse(S.race);if(d>rd)return null;

const FOCUS={'Erhaltung':'Fitness halten: gleichbleibender Umfang, ein bis zwei Tempoeinheiten, alle 4 Wochen eine leichtere Woche.','Wettkampfspezifisch':'Renntempo automatisieren: Intervalle und Abschnitte im Zieltempo, dazu lange Läufe für die Grundlage.','Regeneration':'Körper erholen lassen: kein Tempo, nur locker. Ziel ist, gesund und frisch in den Aufbau zu starten.','Grundlagen':'Aerobe Basis: viel locker laufen, Umfang um 5–8 % pro Woche steigern, 2× Kraft zu Hause.','Tempoentwicklung':'Schnelligkeit und Laufökonomie: kurze Intervalle, Hügelsprints, saubere Technik.','Schwelle & Test':'Schwellentempo stabil halten. Der Testlauf zeigt, ob 2:45 realistisch ist.','Entlastung + Basis':'Nach dem Test kurz erholen, dann den Umfang wieder aufbauen.','Marathonspezifisch':'Marathontempo automatisieren: lange Läufe mit Tempoanteil, Verpflegung üben.','Tapering':'Umfang runter, Frische hoch. Nichts Neues mehr ausprobieren.'};

function readiness(){
 const R={pts:0,why:[],good:[],pain:0,m:{}};
 const H=[];for(let i=1;i<=28;i++){const d=addD(today,-i);const l=S.log[iso(d)];H.push({i,l:(l&&l.done)?l:null})}
 const ck=S.chk[iso(today)]||{},W=S.well||{},wl=W[iso(today)]||{};
 if(ck.pain==2){R.pts+=4;R.pain=2;R.why.push('Du meldest deutliche Schmerzen.')}
 else if(ck.pain==1){R.pts+=2;R.pain=1;R.why.push('Leichtes Ziehen oder Schmerz gemeldet.')}
 if(ck.en==1){R.pts+=1;R.why.push('Du fühlst dich müde.')}else if(ck.en==3)R.good.push('Du fühlst dich frisch.');
 if(ck.leg==1){R.pts+=1;R.why.push('Die Beine fühlen sich schwer an.')}else if(ck.leg==3)R.good.push('Die Beine fühlen sich leicht an.');
 const sl=ck.sleep!=null?ck.sleep:(wl.sleep!=null?wl.sleep:null);R.m.sleep=sl;R.m.sleepSrc=ck.sleep!=null?'Check-in':(wl.sleep!=null?'Intervals.icu':'');
 if(sl!=null){if(sl<5.5){R.pts+=2;R.why.push('Nur ca. '+r1(sl)+' h Schlaf.')}else if(sl<6.5){R.pts+=1;R.why.push('Eher kurze Nacht (ca. '+r1(sl)+' h).')}else if(sl>=7.5)R.good.push('Gut geschlafen (ca. '+r1(sl)+' h).')}
 const others=Object.keys(W).filter(k=>k!==iso(today)&&k>=iso(addD(today,-28))).map(k=>W[k]);
 const avg=f=>{const v=others.map(o=>o[f]).filter(x=>x>0);return v.length>=4?v.reduce((a,b)=>a+b)/v.length:null};
 const rb=avg('rhr'),hb=avg('hrv');
 if(wl.rhr>0){R.m.rhr=wl.rhr;R.m.rhrB=rb;if(rb&&wl.rhr-rb>=8){R.pts+=2;R.why.push('Ruhepuls '+Math.round(wl.rhr)+' (sonst Ø '+Math.round(rb)+').')}else if(rb&&wl.rhr-rb>=5){R.pts+=1;R.why.push('Ruhepuls erhöht: '+Math.round(wl.rhr)+' (sonst Ø '+Math.round(rb)+').')}}
 if(wl.hrv>0){R.m.hrv=wl.hrv;R.m.hrvB=hb;if(hb&&wl.hrv<hb*.75){R.pts+=2;R.why.push('HRV deutlich unter deinem Schnitt.')}else if(hb&&wl.hrv<hb*.85){R.pts+=1;R.why.push('HRV unter deinem Schnitt.')}}
 const wf=W[iso(today)]||W[iso(addD(today,-1))]||{};
 if(wf.ctl!=null&&wf.atl!=null){R.m.form=wf.ctl-wf.atl;if(R.m.form<-30){R.pts+=1;R.why.push('Form stark negativ ('+Math.round(R.m.form)+'): viel aufgestaute Ermüdung.')}}
 const lr=H.filter(h=>h.l&&h.i<=5&&+h.l.rpe>0).slice(0,3);
 if(lr.length){const a=lr.reduce((s,h)=>s+(+h.l.rpe),0)/lr.length;R.m.rpe=a;if(a>=8){R.pts+=2;R.why.push('Die letzten Läufe waren sehr hart (RPE Ø '+a.toFixed(1)+').')}else if(a>=7){R.pts+=1;R.why.push('Die letzten Läufe waren hart (RPE Ø '+a.toFixed(1)+').')}}
 const y=H.find(h=>h.i==1&&h.l);if(y&&+y.l.rpe>=8){R.pts+=1;R.why.push('Gestern war sehr anstrengend.')}
 let st=0;for(const h of H){if(h.l)st++;else break}R.m.streak=st;
 if(st>=7){R.pts+=2;R.why.push(st+' Lauftage in Folge: ein freier Tag ist überfällig.')}else if(st>=6){R.pts+=1;R.why.push(st+' Lauftage in Folge.')}
 const ac=H.filter(h=>h.i<=7&&h.l).reduce((s,h)=>s+(+h.l.km||0),0);R.m.acute=ac;
 const sp=Math.max(0,...H.filter(h=>h.l).map(h=>h.i));if(sp>=21){const ch=H.filter(h=>h.i>7&&h.l).reduce((s,h)=>s+(+h.l.km||0),0)/Math.min(3,(sp-7)/7);R.m.chronic=ch;if(ch>=10){const q=ac/ch;R.m.ratio=q;if(q>1.5){R.pts+=2;R.why.push('Der Umfang der letzten 7 Tage ist '+q.toFixed(1)+'× so hoch wie dein 4-Wochen-Schnitt.')}else if(q>1.3){R.pts+=1;R.why.push('Der Umfang steigt schnell ('+q.toFixed(1)+'× dein Schnitt).')}}}
 R.lvl=(R.pain==2||R.pts>=4)?2:(R.pts>=2?1:0);
 if(!R.why.length&&!R.good.length)R.good.push('Keine Warnsignale in deinen Daten.');
 return R}

function adjust(p,R){
 const lv=R.lvl,t=p.t,km=p.km;
 if(t=='rest')return{mode:'plan',km:0,title:'Recovery-Tag',note:lv==2?'Erholung ist heute dein wichtigstes Training.':''};
 if(R.pain==2)return{mode:'rest',km:0,title:'Heute kein Lauf',note:'Bei deutlichem Schmerz nicht laufen. Wird es in 2–3 Tagen nicht besser, lass es ärztlich oder physiotherapeutisch abklären.'};
 if(lv==0)return{mode:'plan',km,title:null,note:''};
 if(t=='race')return{mode:'move',km:0,title:'Wettkampf verschieben',note:'Ein Test in angeschlagenem Zustand liefert falsche Paces. Besser 2–4 Tage verschieben.'};
 if(lv==1){const k=Math.max(3,Math.round(km*.8));return{mode:'reduced',km:k,title:null,note:t=='q'?'Tempoanteil um etwa ein Drittel kürzen (eine Wiederholung bzw. einen Block weniger), Pausen 30 s länger.':t=='long'?'Longrun um 20 % kürzen und die Tempoabschnitte weglassen.':'Lauf um 20 % kürzen und am langsamen Ende der Tempospanne bleiben.'}}
 if(t=='easy')return{mode:'rest',km:0,title:'Heute Pause',note:'Besser ein freier Tag oder 20–30 min Spaziergang. Laufen höchstens ganz locker (RPE ≤ 3).'};
 if(t=='q')return{mode:'swap',km:Math.min(8,Math.round(km*.5)),title:null,note:'Qualität heute streichen. Stattdessen frei oder ein kurzer, sehr lockerer Lauf. Nicht nachholen, sondern im Plan weitermachen.'};
 return{mode:'swap',km:Math.min(12,Math.round(km*.5)),title:null,note:'Longrun heute stark kürzen: höchstens 60–75 min sehr locker, oder verschieben.'}}

function spark(vals){
 const pts=[];vals.forEach((v,i)=>{if(v!=null)pts.push([i,v])});
 if(pts.length<2)return'';

/* ===== Prognose aus Läufen ===== */
const PD=[[5,'5 km'],[10,'10 km'],[15,'15 km'],[21.0975,'Halbmarathon'],[42.195,'Marathon']];
function prognAt(runs,asOf){
 const asd=asOf?parse(asOf):today,hi=iso(asd),lo=iso(addD(asd,-7*26)),o={};
 for(const[dk]of PD){let best=null;
  for(const r of runs){
   if(!(r.km>=3&&r.sec>0)||r.d>hi||r.d<lo)continue;
   const pc=r.sec/r.km;if(pc<150||pc>540||r.km>70)continue;
   if(dk>=10&&r.km<dk*.3)continue;
   const wk=Math.max(0,(asd-parse(r.d))/(7*D)),raw=r.sec*Math.pow(dk/r.km,1.06),adj=raw*(1+.004*wk);
   if(!best||adj<best.adj)best={adj,sec:adj,raw,r}}
  if(best)o[dk]=best}
 return o}
const progn=()=>prognAt(allRuns());
function progCard(){
 const P=progn(),K=RD(),M=P[42.195],n=allRuns().length;
 const row=([dk,nm])=>{const x=P[dk];if(!x)return'<div class="pr"><span>'+nm+'</span><b>–</b><small></small></div>';
  const isR=Math.abs(dk-K)<.3&&!S.noPlan&&K<40,gt=GT(),df=x.sec-gt;
  return'<div class="pr'+(isR?' rc':'')+'"><span>'+nm+'</span><b>'+(x.sec>=3600?ft(x.sec):fp(x.sec))+'</b><small>'+fp(x.sec/dk)+' /km'+(isR?' · Ziel '+(gt>=3600?ft(gt):fp(gt))+' ('+(df>0?'+':'−')+fp(Math.abs(df))+')':'')+'</small></div>'};
 let head;
 if(M){const gap=M.sec-S.goal,mt=CF().mode=='maintain';
  head='<div class="pm"><div><span class="pl1">Marathon</span><b>'+ft(M.sec)+'</b><small>'+fp(M.sec/42.195)+' /km</small></div>'
   +(!S.noPlan&&!mt&&K>=40?'<div class="pg '+(gap<=0?'ok':'')+'"><span>Ziel '+ft(S.goal)+'</span><b>'+(gap<=0?'erreicht':fp(Math.abs(gap))+' min fehlen')+'</b></div>':'')+'</div>'}
 else head='<div class="pm"><div><span class="pl1">Marathon</span><b>–</b><small>'+(n?'Dafür braucht es einen Lauf ab 13 km.':'Noch keine Läufe vorhanden.')+'</small></div></div>';
 const base=M?'<small class="pb2">Basis: '+esc(M.r.n)+', '+dshort(M.r.d)+' ('+dec(M.r.km,1)+' km in '+dur(M.r.sec)+')</small>':'';
 return'<div class="card prog"><h3>Prognose'+inf('prog')+'</h3><div class="sub">Berechnet aus deinen Läufen der letzten 26 Wochen</div>'+head+'<div class="pgrid">'+PD.slice().reverse().filter(x=>x[0]<42).map(row).join('')+'</div>'+base+'</div>'}

/* ===== Kennzahlen ===== */
function kpis(w,ws,pl,ac,days,has){
 const K=RD(),mt=CF().mode=='maintain';
 let nx=0;for(let i=0;i<7;i++){const q=plan(addD(ws,7+i),1);if(q)nx+=q.km}
 const tw=Math.round((mon(parse(S.race))-mon(START))/(7*D))+1,cw=Math.max(1,Math.min(tw,Math.round((ws-mon(START))/(7*D))+1));
 const phS=S.noPlan?'Kein Plan':days<0?'Abgeschlossen':today<START?'Startet bald':ph(w).replace('Tempoentwicklung','Tempo&shy;entwicklung').replace('Marathonspezifisch','Marathon&shy;spezifisch').replace('Wettkampfspezifisch','Wettkampf&shy;spezifisch');
 const phSub=S.noPlan||days<0||today<START?(S.noPlan?'Im Kalender erstellen':days<0?'Neuen Plan erstellen':'Start '+dshort(iso(START))):'Woche '+cw+' von '+tw;
 const ti=(l,v,s,k)=>'<div class="st"><span>'+l+inf(k)+'</span><b>'+v+'</b><span>'+s+'</span></div>';
 const t1=(has||pl>0?ti('Geplante Wochen-km',Math.round(pl)+' km',Math.round(ac)+' gelaufen · nächste Woche '+Math.round(nx),'wkm'):ti('Wochen-km',Math.round(ac)+' km',nx>0?'gelaufen · nächste Woche '+Math.round(nx)+' geplant':'gelaufen · kein Plan','wk0'));
 const t2=ti('Trainingsphase',phS,phSub,'phase');
 const t3=(!mt&&!S.noPlan&&K<40&&has)?ti('Renntempo',fp(rpace())+' /km','Ziel '+ft(GT()),'rpace'):'';
 return '<div class="stats">'+t1+t2+t3+'</div>'}

/* ===== Briefing ===== */
function briefing(R){

 if(l7.length){const base=b3.length?mean(b3):null,df=base&&base>=10?(km7/base-1)*100:null;
  const lg=l7.reduce((a,r)=>r.km>a.km?r:a,l7[0]),sk=l7.reduce((s,r)=>s+(r.sec>0?r.km:0),0),ss=l7.reduce((s,r)=>s+(r.sec>0?r.sec:0),0);
  back='<b>'+l7.length+' '+(l7.length==1?'Lauf':'Läufe')+' · '+Math.round(km7)+' km</b> in den letzten 7 Tagen'+(df!=null?' ('+fmtPct(df)+' zum Schnitt der 3 Wochen davor)':'')+'. Längster Lauf '+dec(lg.km,1)+' km'+(sk>0?', Ø Pace '+fp(ss/sk)+' /km':'')+'.'}
 else back='In den letzten 7 Tagen ist kein Lauf erfasst. '+(ICU.key?'Läufe kommen automatisch aus Intervals.icu.':'Verbinde Intervals.icu oder trage Läufe im Kalender ein.');
 const now_=progn()[42.195],old=prognAt(A,dd(28))[42.195],parts=[];
 if(now_&&old){const d=now_.sec-old.sec;parts.push('Marathon-Prognose <b>'+ft(now_.sec)+'</b>, '+(Math.abs(d)<20?'unverändert zu vor 4 Wochen':fp(Math.abs(d))+' min '+(d<0?'schneller':'langsamer')+' als vor 4 Wochen'))}
 else if(now_)parts.push('Marathon-Prognose <b>'+ft(now_.sec)+'</b>');
 const cs=wser('ctl',42,true),c1=lastv(cs),c0=mean(cs.slice(0,7));
 if(c1!=null&&c0!=null&&cnt(cs)>=8)parts.push('Fitness (CTL) '+Math.round(c1)+' ('+(c1-c0>=0?'+':'−')+Math.abs(Math.round(c1-c0))+' in 6 Wochen)');
 const rp=r=>r.filter(x=>x.km>=5&&x.sec>0),pa=a=>{const k=a.reduce((s,r)=>s+r.km,0);return k>0?a.reduce((s,r)=>s+r.sec,0)/k:null};
 const pn=pa(rp(inR(13,0))),po=pa(rp(inR(41,14)));
 if(pn&&po&&Math.abs(pn-po)>=3)parts.push('Tempo in Läufen ab 5 km '+Math.round(Math.abs(pn-po))+' s/km '+(pn<po?'schneller':'langsamer')+' als in den 4 Wochen davor');
 const perf=parts.length?parts.join('. ')+'.':'Noch zu wenig Läufe für eine Einschätzung. Mit jedem Lauf wird sie genauer.';
 const m=R.m,rc=[];
 if(m.rhr!=null)rc.push('Ruhepuls '+Math.round(m.rhr)+' bpm'+(m.rhrB?' (Ø '+Math.round(m.rhrB)+')':''));
 if(m.hrv!=null)rc.push('HRV '+Math.round(m.hrv)+' ms'+(m.hrvB?' (Ø '+Math.round(m.hrvB)+')':''));
 if(m.sleep!=null)rc.push('Schlaf '+dec(m.sleep,1)+' h');
 if(m.form!=null)rc.push('Form '+String(Math.round(m.form)).replace('-','−'));
 const vd=['Du bist gut erholt, der Plan kann wie vorgesehen laufen.','Leichte Ermüdung: heute etwas kürzer oder lockerer laufen.','Deutliche Ermüdung: Erholung hat heute Vorrang.'][R.lvl];
 const rec=(rc.length?rc.join(', ')+'. ':'')+vd+(R.why.length&&R.lvl>0?' '+R.why[0]:'');
 const row=(c,l,k,t)=>'<div class="bf" style="--bc:'+c+'"><div class="bl">'+l+inf(k)+'</div><div class="bt">'+t+'</div></div>';
 return'<div class="card brief"><h3>Briefing</h3><div class="sub">Letzte Tage, Leistung und Erholung auf einen Blick</div>'
  +row('#2563eb','Rückblick','bf_back',back)+row('#7c5cd6','Leistung','bf_perf',perf)+row(['#16a34a','#f5b301','#ef4444'][R.lvl],'Erholung','bf_rec',rec)+'</div>'}

const REG=p=>['Regeneration','<b>10 min Mobility</b> nach dem Lauf: Hüftbeuger, Waden und Gesäß je 2 × 45 s'+(p.t=='long'||p.t=='race'?', danach Beine 10 min hochlegen':p.t=='q'?', danach Faszienrolle für Waden und Oberschenkel':'')+'.'];
function trainBlock(p,adj,z){
 const e=fp(z.e1)+'–'+fp(z.e2)+' /km',ep=(z.e1+z.e2)/2,k=adj.km,min=Math.round(k*ep/60),rows=[],tips=[];
 const kind=(adj.mode=='swap'&&p.t=='q')?'easy':p.t;
 const kraft=['Kraft','20–25 min nach dem Lauf: je 3 Sätze einbeinige Kniebeuge, Hip Thrust und Wadenheben, dazu Seitstütz 2 × 30–45 s'];
 if(p.t=='rest'||adj.mode=='rest'){
  rows.push(['Bewegung','20–30 min Spaziergang oder lockeres Radeln (RPE ≤ 3), nur wenn es sich gut anfühlt']);
  rows.push(['Regeneration','<b>15 min Mobility:</b> Hüftbeuger 2 × 45 s je Seite, Waden an der Wand, Glute Bridge 2 × 12, danach Faszienrolle für Waden und Oberschenkel']);
  tips.push('Kein Training mit Pulsanstieg: Die Anpassung passiert in der Ruhe.');
  return{meta:'Ruhetag',rows,tips}}
 if(adj.mode=='move'){
  rows.push(['Heute','Locker 20–30 min (RPE ≤ 3) oder komplett frei']);

 if(kind=='easy'){

  rows.push(['Abschluss',adj.mode=='plan'&&/Steigerungsläufe/.test(p.d)?'6 × 20 s Steigerung (flüssig, ca. 90 %), dazwischen 40 s traben':'5 min gehen, Waden und Hüftbeuger kurz dehnen']);
  if(p.str&&adj.mode!='swap')rows.push(kraft);
  rows.push(REG(p));

  return{meta:k+' km · ca. '+min+' min',rows,tips}}
 if(kind=='q'){
  rows.push(['Aufwärmen','15 min locker bei '+e+', dann Lauf-ABC und 3 × 80 m Steigerung']);

  if(p.str)rows.push(kraft);
  rows.push(REG(p));

  rows.push(['Start','5–10 min sehr locker, die ersten 3 km bewusst langsam']);

  rows.push(REG(p));

 const mar=p.lab=='MARATHON';
 rows.push(['Aufwärmen','15–20 min locker, Lauf-ABC 2 × 20 m, 4 × 80–100 m Steigerung']);
 rows.push(['Rennen',p.d]);
 rows.push(['Danach','10–15 min auslaufen, Ergebnis unter „Leistung“ eintragen']);
 rows.push(REG(p));
 tips.push(mar?'Km 1–10 kontrolliert (3–5 s/km langsamer als Zielpace), Km 10–30 gleichmäßig, ab Km 30 geben, was übrig ist.':'Erste 2 km nicht schneller als Zielpace, ab Km 5 dranbleiben, ab Km 8 Gas geben.');
 return{meta:mar?'Renntag':'Wettkampf-Test',rows,tips}}

function foodBlock(p,adj,z,rest,nx){

 const lng=(kind=='long'||mar),fuel=mar||hm||kind=='long'||min>=90;
 const nbig=nx&&(nx.t=='long'||nx.t=='q'||nx.t=='race');
 let h='',meta='Frühstück · Mittag · Abend · Trinken';
 /* Frühstück */
 if(rest)h+=sec('Frühstück','<b>25–30 g Eiweiß</b> plus Kohlenhydrate wie gewohnt.',['200 g Skyr oder Quark mit Haferflocken, Beeren und Nüssen','2 Scheiben Vollkornbrot mit Rührei (2 Eier) und Tomate']);
 else if(rc)h+=sec('Frühstück','<b>3 h vor dem Start ein bewährtes Frühstück</b>'+(w?' (ca. '+g(2)+' g Kohlenhydrate)':' (ca. 2 g pro kg Körpergewicht)')+', dazu 400–500 ml Wasser.',['Weißbrot oder Toast mit Honig und Banane','Haferbrei mit Honig'],'Nichts Neues am Renntag.'+(mar||hm?' 15 min vor dem Start 1 Gel.':''));

 const dr=['<b>'+lit+' über den Tag</b>'+(w?' (ca. 35 ml pro kg)':'')+', der Urin sollte hellgelb sein.'];
 const dex=['Ein Glas Wasser zu jeder Mahlzeit, dazu ungesüßter Tee'];
 if(!rest){dex.push('Vor dem Lauf: 300–500 ml in den 2 h davor');dex.push('Beim Lauf'+(min>=60||fuel?': alle 15–20 min ein paar Schlucke (ca. 400–800 ml pro Stunde)':': bei unter 60 min reicht Wasser nach Durst'));dex.push('Danach: 500 ml pro 0,5 kg Gewichtsverlust'+(lng||min>=90?', mit einer Prise Salz oder Elektrolyten':''))}

 else if(key=='hrv')wl(x=>x.hrv>0?x.hrv:null);
 else if(key=='sleep')wl(x=>x.sleep>0?x.sleep:null);
 else if(key=='ctl')wl(x=>x.ctl!=null?x.ctl:null);

 else if(key=='km'){let started=false;for(let i=25;i>=0;i--){const ws=addD(mon(today),-7*i);let t=0;for(let j=0;j<7;j++){const l=S.log[iso(addD(ws,j))];if(l&&l.done)t+=+l.km||0}

 const rc=lastv(rh),rb=mean(rh.slice(0,-3));if(rc!=null&&rb!=null&&rc-rb>=5)F('r','Ruhepuls '+Math.round(rc)+' bpm, Schnitt '+Math.round(rb)+' bpm.','Infekt, Stress oder Übertraining? Der Ruhepuls ist zuletzt erhöht.');
 const hc=lastv(hv),hb=mean(hv.slice(0,-3));if(hc!=null&&hb!=null&&hc<hb*.85)F('r','HRV '+Math.round(hc)+' ms, Schnitt '+Math.round(hb)+' ms.','Die HRV liegt unter dem Schnitt: Wie sind Schlaf und Stress?');
 const sa=mean(sl.slice(-7));if(sa!=null&&sa<6.5)F('y','Schlaf nur Ø '+dec(sa,1)+' h in den letzten 7 Tagen.','Was lässt sich am Schlaf verbessern?');
 const cs=wsr(W,'ctl',42,true),as=wsr(W,'atl',42,true),cl=lastv(cs),al=lastv(as);
 if(cl!=null&&al!=null){const fm=cl-al;if(fm<-30)F('r','Form '+Math.round(fm)+': sehr viel Ermüdung.','Braucht der Athlet eine Entlastungswoche?');else if(fm>10)F('y','Form +'+Math.round(fm)+': sehr frisch, evtl. zu wenig Reiz.','Passt der Wettkampfkalender zum Formverlauf?')}
 const pr=prognAt(runs),pr0=prognAt(runs,dd(28));
 return{runs,W,cx,wk,w0,pb,n28,last,flags,talk,pr,pr0,cs,as,rh,hv,sl,cl,al,rc,rb,hc,hb,sa}}
function coachText(a,I){
 const L=['Coaching-Überblick: '+a.name+' (Stand '+new Date().toLocaleDateString('de-DE')+')',''];
 L.push('Letzte 7 Tage: '+Math.round(I.w0)+' km; Ø 4 Wochen: '+Math.round(mean(I.wk.slice(-5,-1).map(x=>x.v))||0)+' km/Woche; Läufe (28 Tage): '+I.n28);
 if(I.pr[42.195])L.push('Prognosen: '+PD.slice().reverse().filter(x=>I.pr[x[0]]).map(x=>x[1]+' '+(I.pr[x[0]].sec>=3600?ft(I.pr[x[0]].sec):fp(I.pr[x[0]].sec))).join(', '));
 L.push('','Auffälligkeiten:');I.flags.forEach(f=>L.push('- ['+({g:'ok',y:'beachten',r:'Achtung'})[f.c]+'] '+f.t));
 L.push('','Gesprächsthemen:');I.talk.filter(Boolean).forEach(t=>L.push('- '+t));
 return L.join('\n')}
function rCoach(){
 const el=$('#coach');if(!el||!isAdm())return;
 const C=CO(),A=C.a;if(CSEL>=A.length)CSEL=0;
 const chips=A.map((x,i)=>'<button class="chip '+(i==CSEL?'on':'')+'" data-ca="'+i+'">'+esc(x.name)+'</button>').join('')+'<button class="chip" id="cadd">＋ Athlet</button>';
 const h='<div class="card"><h3>Coaching'+inf('co')+'</h3><div class="sub">Insights eines Athleten als Gesprächsgrundlage. Nur für dich sichtbar.</div><div class="cr">'+chips+'</div></div>';
 const form='<div class="card" id="cform"'+(A.length?' hidden':'')+'><h3>Athlet hinzufügen</h3><div class="sub">Der Athlet gibt dir in Intervals.icu Coach-Zugriff. Dann genügt seine Athlete-ID und dein eigener API-Schlüssel. Alternativ trägst du seinen API-Schlüssel ein.</div><div class="f"><label>Name<input id="can" placeholder="z. B. Anna"></label><label>Athlete-ID<input id="cai" placeholder="z. B. i123456"></label><label>API-Schlüssel (optional)<input id="cak" type="password" autocomplete="off" placeholder="leer = dein Schlüssel"></label></div><div id="caerr" class="aerr" hidden></div><div class="b"><button class="pri" id="cago">Hinzufügen &amp; laden</button></div><small>Die Daten bleiben nur in diesem Browser. Hol dir vorher das Einverständnis des Athleten.</small></div>';
 if(!A.length){el.innerHTML=h+form;wireCoach();return}
 const a=A[CSEL],I=coachInsights(a),tl=(c,v,l,k)=>'<div class="tl ac" style="--ac:'+c+'"><b>'+v+'</b><span>'+l+(k?inf(k):'')+'</span></div>';
 const m=I.pr[42.195],m0=I.pr0[42.195];
 const ln=lineSvg(I.wk,'#7c5cd6',340,150,'c');
 const V=runsView(I.runs,I.cx);
 const spk=(lab,vals,unit,f)=>{const c=lastv(vals);return c==null?'':'<div class="tr neu" style="cursor:default"><div class="tx"><div class="tn">'+lab+'</div><div class="tv"><b>'+f(c)+'</b> '+unit+'</div></div>'+spark(vals.slice(-14))+'</div>'};
 const sum='<div class="card"><div class="oh"><h3>'+esc(a.name)+'</h3><button class="rngb" id="cref">'+(CBUSY?'lädt …':'Aktualisieren')+'</button></div><div class="sub">Stand: '+(a.at?new Date(a.at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'noch nicht geladen')+' · '+I.runs.length+' Läufe aus 26 Wochen</div><div id="cer" class="aerr" hidden></div>'
  +'<div class="tiles">'+tl('#16a34a',Math.round(I.w0)+' km','Letzte 7 Tage')+tl('#3b82f6',Math.round(mean(I.wk.slice(-5,-1).map(x=>x.v))||0)+' km','Ø 4 Wochen')+tl('#f97316',I.n28,'Läufe (28 T)')+tl('#8b5cf6',m?ft(m.sec):'–','Marathon-Prognose','prog')+tl('#0ea5e9',I.cl!=null?Math.round(I.cl):'–','Fitness (CTL)','t_ctl')+tl('#ef4444',I.cl!=null&&I.al!=null?Math.round(I.cl-I.al):'–','Form','t_form')+'</div>'
  +(m&&m0?'<small>Prognose '+(m.sec<m0.sec-20?fp(m0.sec-m.sec)+' min schneller':m.sec>m0.sec+20?fp(m.sec-m0.sec)+' min langsamer':'unverändert')+' gegenüber vor 4 Wochen.</small>':'')+'</div>';
 const fl='<div class="card"><h3>Auffälligkeiten</h3><div class="sub">Ampel aus den Daten des Athleten</div>'+I.flags.map(f=>'<div class="an a-'+f.c+'">'+f.t+'</div>').join('')+'</div>';
 const tk=I.talk.filter(Boolean);
 const talk='<div class="card"><h3>Gesprächsthemen</h3><div class="sub">Vorschläge für das Coaching-Gespräch</div>'+(tk.length?'<div class="an nx"><ul>'+tk.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>':'<div class="an a-g">Keine Auffälligkeiten. Frag nach Zielen, Terminen und dem Gefühl im Training.</div>')+'<div class="b"><button id="ccp">Zusammenfassung kopieren</button></div></div>';
 const chart='<div class="card"><h3>Wochenumfang</h3><div class="sub">Letzte 26 Wochen · Ø '+Math.round(ln.avg)+' km (gestrichelt)</div>'+ln.svg+V.mixBar+'</div>';
 const well=(spk('Ruhepuls',I.rh,'bpm',Math.round)+spk('HRV',I.hv,'ms',Math.round)+spk('Schlaf',I.sl,'h',v=>dec(v,1)))||'<div class="mu">Keine Wellness-Daten (Ruhepuls, HRV, Schlaf) gefunden.</div>';
 const wl='<div class="card"><h3>Erholung</h3><div class="sub">Trend der letzten 14 Tage aus Intervals.icu</div>'+well+'</div>';
 const rl=I.runs.slice(0,5).map(r=>{const an=analyzeRun(r,I.cx),d=parse(r.d);return'<div class="run" style="--kc:'+KCOL[an.kind]+'"><div class="cl"><div class="rd"><b>'+DOW[(d.getDay()+6)%7]+'</b><span>'+d.getDate()+'.</span></div><div class="rm"><div class="rn">'+esc(r.n)+'</div><small><span class="kt" style="background:'+KCOL[an.kind]+'">'+KIND[an.kind]+'</span> '+(r.sec?dur(r.sec):'–')+(an.pc?' · '+fp(an.pc)+' /km':'')+(r.hr?' · '+r.hr+' bpm':'')+'</small></div><span class="vd v-'+an.v.c+'">'+an.v.t+'</span><div class="rk"><b>'+dec(r.km,1)+'</b><span>km</span></div></div><small>'+(an.bad.length?an.bad[0].t:an.good[0])+'</small></div>'}).join('');
 const runsC='<div class="card"><h3>Letzte Läufe</h3>'+(rl||'<div class="mu">Keine Läufe.</div>')+'<div class="b"><button id="crm" class="chip">Athlet entfernen</button></div></div>';
 el.innerHTML=h+form+sum+fl+talk+chart+wl+runsC;wireCoach(a,I)}
function wireCoach(a,I){
 const el=$('#coach');
 el.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>{CSEL=+b.dataset.ca;rCoach()});
 const ad=$('#cadd');if(ad)ad.onclick=()=>{const f=$('#cform');f.hidden=!f.hidden;if(!f.hidden)f.scrollIntoView({behavior:'smooth'})};
 const go=$('#cago');
 if(go)go.onclick=async()=>{
  const err=m=>{const e=$('#caerr');e.textContent=m;e.hidden=!m},nm=$('#can').value.trim(),aid=$('#cai').value.trim(),key=$('#cak').value.trim();
  err('');if(!nm||!aid)return err('Bitte Name und Athlete-ID eingeben.');
  const x={aid,name:nm,key,runs:[],well:{}};go.disabled=true;go.textContent='Lade …';
  try{await coachSync(x);const C=CO();C.a.push(x);CSEL=C.a.length-1;save();rCoach()}catch(e){err(e.message);go.disabled=false;go.textContent='Hinzufügen & laden'}};
 const rf=$('#cref');
 if(rf)rf.onclick=async()=>{if(CBUSY)return;CBUSY=true;rf.textContent='lädt …';
  try{await coachSync(a);CBUSY=false;rCoach()}catch(e){CBUSY=false;rCoach();const er=$('#cer');if(er){er.textContent=e.message;er.hidden=false}}};
 const rm=$('#crm');if(rm){let c=0;rm.onclick=()=>{if(!c){c=1;rm.textContent='Wirklich entfernen? Nochmal tippen';return}CO().a.splice(CSEL,1);CSEL=0;save();rCoach()}}
 const cp=$('#ccp');if(cp)cp.onclick=()=>{const t=coachText(a,I);const done=()=>{cp.textContent='✓ Kopiert'};
  try{navigator.clipboard.writeText(t).then(done,()=>{prompt('Text kopieren:',t)})}catch(e){prompt('Text kopieren:',t)}}}

function render(){
 const y=window.scrollY;
 calcAd();
 const days=Math.round((parse(S.race)-today)/D);
 $('#cd').innerHTML=S.noPlan?'Kein Plan aktiv':CF().mode=='maintain'?(days>=0?'Plan noch <b>'+days+'</b> Tage':'Plan beendet'):(days>=0?'Rennen in <b>'+days+'</b> Tagen':'Rennen vorbei');
 rToday();rCal();rRuns();rPerf();rSet();rCoach();
 window.scrollTo(0,y)}
function showTab(t){document.querySelectorAll('nav.dock button').forEach(x=>x.classList.toggle('on',x.dataset.t==t));['today','cal','runs','perf','set','coach'].forEach(id=>{const e=$('#'+id);if(e)e.hidden=id!=t});document.querySelectorAll('nav.dock button').forEach(x=>{if(x.dataset.t==t)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});window.scrollTo(0,0)}
function navCoach(){const nv=document.querySelector('nav.dock'),ex=nv.querySelector('[data-t="coach"]');
 if(isAdm()&&!ex){const b=document.createElement('button');b.dataset.t='coach';b.innerHTML='<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M17 5.5a3 3 0 0 1 0 5.8M18.5 14.8c1.8.7 3 2.4 3.4 5.2"/></svg><span>Coaching</span>';nv.appendChild(b)}
 if(!isAdm()&&ex)ex.remove();
 nv.classList.toggle('six',isAdm());
 nv.querySelectorAll('button').forEach(b=>b.onclick=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}showTab(b.dataset.t)})}

const ICU_WEEKS=26;
let icuBusy=false,icuLast=0;
const fromIcu=o=>!!o&&(o.src==='icu'||o.note==='Intervals.icu');
async function icuSync(){
 if(!ICU.key){setSync('Intervals.icu verbinden →');return}
 if(icuBusy)return;icuBusy=true;
 setSync('⏳ lädt Läufe…');
 try{
  const base='https://intervals.icu/api/v1/athlete/'+encodeURIComponent((ICU.id||'').trim()||'0'),hd={Authorization:'Basic '+btoa('API_KEY:'+ICU.key)};
  const from=iso(addD(today,-7*ICU_WEEKS)),to=iso(addD(today,1));
  let r;
  try{r=await fetch(base+'/activities?oldest='+from+'&newest='+to,{headers:hd})}
  catch(e){throw new Error(navigator.onLine===false?'Offline – Abruf folgt, sobald du online bist':'Keine Verbindung zu Intervals.icu')}
  if(r.status==401||r.status==403)throw new Error('Zugang abgelehnt: API-Schlüssel (und ggf. Athlete-ID) prüfen');
  if(!r.ok)throw new Error('Intervals.icu meldet Fehler '+r.status);
  const acts=await r.json();
  if(!Array.isArray(acts))throw new Error('Unerwartete Antwort von Intervals.icu');
  const by={},RUNS=[];
  for(const a of acts){
   if(!/Run/.test(a.type||''))continue;
   const k=String(a.start_date_local||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;
   const b=by[k]||(by[k]={km:0,sec:0,rpe:0});
   b.km+=(+(a.icu_distance!=null?a.icu_distance:a.distance)||0)/1000;
   b.sec+=+(a.moving_time!=null?a.moving_time:a.elapsed_time)||0;
   b.rpe=Math.max(b.rpe,+(a.icu_rpe||a.perceived_exertion)||0);
   RUNS.push({id:a.id,d:k,t:String(a.start_date_local).slice(11,16),n:a.name||'Lauf',km:Math.round((+(a.icu_distance!=null?a.icu_distance:a.distance)||0)/10)/100,sec:+(a.moving_time!=null?a.moving_time:a.elapsed_time)||0,hr:Math.round(+a.average_heartrate)||null,mx:Math.round(+a.max_heartrate)||null,el:Math.round(+a.total_elevation_gain)||null,ld:Math.round(+a.icu_training_load)||null,rpe:+(a.icu_rpe||a.perceived_exertion)||0})}
  if(acts.length)S.runs=RUNS.sort((x,y)=>(y.d+y.t)<(x.d+x.t)?-1:1);
  let fresh=0;
  for(const k in by){const o=S.log[k]||{},b=by[k];if(!o.done)fresh++;
   S.log[k]={done:true,km:r1(b.km),min:Math.round(b.sec/60),rpe:o.rpe||(b.rpe?String(b.rpe):''),note:o.note||'Intervals.icu',src:'icu'}}
  if(acts.length)for(const k of Object.keys(S.log)){if(k>=from&&k<=to&&!(k in by)&&fromIcu(S.log[k]))delete S.log[k]}
  try{const wr=await fetch(base+'/wellness?oldest='+iso(addD(today,-84))+'&newest='+iso(today),{headers:hd});
   if(wr.ok){const arr=await wr.json(),W={};for(const x of arr){const id=String(x.id||'').slice(0,10);if(!id)continue;W[id]={rhr:x.restingHR||null,hrv:x.hrv||null,sleep:x.sleepSecs?x.sleepSecs/3600:null,ctl:x.ctl!=null?x.ctl:null,atl:x.atl!=null?x.atl:null}}S.well=W}}catch(e){}
  icuLast=Date.now();save();render();
  setSync('✅ '+(fresh==0?'aktuell':fresh==1?'1 neuer Lauftag':fresh+' neue Lauftage')+' · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSync('⚠️ '+(e.message||'Sync fehlgeschlagen'))}
 finally{icuBusy=false}}
$('#sy').onclick=()=>{if(!ICU.key)showTab('set');else icuSync()};
$('#pf').onclick=()=>showTab('set');
const DAY0=iso(new Date());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(iso(new Date())!==DAY0){location.reload();return}icuSync()}});

setInterval(()=>{if(!document.hidden&&Date.now()-icuLast>10*60*1000)icuSync()},60000);
icuSync();
if(!UID)showAuth();
