<style>

*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}

.top{background:linear-gradient(135deg,#14397a 0%,#0a1f44 55%,#061330 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;border-radius:0 0 22px 22px}

.logo{height:30px;width:auto;display:block}
.top .meta{text-align:right;font-size:.74rem;line-height:1.35;color:#b7c4e3;min-width:0}

.wrap{max-width:860px;margin:0 auto;padding:4px 14px calc(92px + env(safe-area-inset-bottom,0px))}
h3{margin:0 0 4px}.mu,small{color:var(--mu)}
.st,.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.st{min-width:0}.st b{display:block;font-size:1.1rem;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}.st span{font-size:.75rem;color:var(--mu)}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 11px}
button{cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-tx);font-weight:600}

.t-easy{border-top-color:var(--easy)}.t-q{border-top-color:var(--q)}.t-long{border-top-color:var(--long)}.t-race{border-top-color:var(--race)}
.c .n{font-weight:700;font-size:.72rem}.c .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c .k{color:var(--mu)}
.c.dn{background:color-mix(in srgb,var(--ok) 18%,var(--card))}.ck{color:var(--ok);font-weight:700}
.sm{display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;font-size:.8rem}
.pl{border-left:4px solid var(--bd);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px}
.pl.t-easy{border-color:var(--easy)}.pl.t-q{border-color:var(--q)}.pl.t-long{border-color:var(--long)}.pl.t-race{border-color:var(--race)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.modal[hidden],[hidden]{display:none!important}
.modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}
label{display:flex;flex-direction:column;font-size:.78rem;color:var(--mu);gap:2px}label.row{flex-direction:row;align-items:center;gap:8px;font-size:.95rem;color:var(--tx)}
label input{width:100%}.row input{width:auto}
.b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left}
.bar2,.bar i{display:block}.bar{height:8px;border-radius:4px;background:var(--bd);margin:2px 0;overflow:hidden}.bar i{height:100%}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--mu);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px}

<div class="wrap">

<script>

const D=864e5,A=[[49,15],[48,35],[47,50],[40,70],[37,66],[29,78],[22,90],[21,86],[20,70],[16,90],[5,120],[3,96],[2,72],[1,50],[0,45]];
const START=new Date(2026,9,12),$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),mon=d=>addD(d,-((d.getDay()+6)%7));
const fp=s=>{s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
const ft=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=x=>Math.round(x*10)/10;
const DEF=()=>({race:'2027-09-26',goal:9900,base:11400,res:[],log:{},chk:{},well:{}});let S=DEF();
try{const x=localStorage.getItem('mplan2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
let ICU={id:'',key:''};
try{const x=localStorage.getItem('mplan_icu');if(x)ICU=JSON.parse(x)}catch(e){}
const setSync=t=>{const e=$('#sy');if(e)e.textContent=t};
const store=()=>{try{localStorage.setItem('mplan2',JSON.stringify(S))}catch(e){}};
const save=()=>store();
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const wtr=d=>Math.round((mon(parse(S.race))-mon(d))/(7*D));
const ph=w=>w>=48?'Regeneration':w>=38?'Grundlagen':w>=30?'Tempoentwicklung':w>=21?'Schwelle & Test':w>=17?'Entlastung + Basis':w>=4?'Marathonspezifisch':'Tapering';
function vol(w){if(w>=49)return 15;if(w<=0)return 45;for(let i=0;i<A.length-1;i++){const[a,x]=A[i],[b,y]=A[i+1];if(w<=a&&w>=b)return a==b?x:y+(x-y)*(w-b)/(a-b)}return 45}
const gp=()=>S.goal/42.195;
function expP(d){const b=S.base/42.195,e=addD(mon(parse(S.race)),-35),f=Math.max(0,Math.min(1,(d-START)/(e-START)));return b+(gp()-b)*f}
function fitP(){let b=null;for(const r of S.res){const p=r.sec*Math.pow(42.195/r.km,1.06)/42.195;if(!b||r.d>=b.d)b={d:r.d,p}}return b}
function Z(d){const f=fitP();let P=f?f.p:expP(d);P=Math.max(P,gp());return{mp:P,e1:P*1.16,e2:P*1.3,t:P*.945,i:P*.91,r:P*.87}}
let AD={f:1,msg:'Noch zu wenig Daten – trage deine Läufe ein, dann passt sich der Plan an.'};
function calcAd(){let pl=0,ac=0,rs=[],n=0;AD={f:1,msg:AD.msg};
 for(let i=1;i<=14;i++){const d=addD(today,-i);if(d<START)break;const p=plan(d,1),l=S.log[iso(d)];if(p&&p.km)pl+=p.km;if(l&&l.done){n++;ac+=+l.km||0;if(l.rpe&&i<=7)rs.push(+l.rpe)}}
 if(n<3||pl<20){AD={f:1,msg:'Noch zu wenig Daten – trage mindestens 3 Läufe ein, dann passt sich der Plan an.'};return}
 const c=ac/pl,rp=rs.length?rs.reduce((a,b)=>a+b)/rs.length:0;
 if(rp>=8)AD={f:.85,msg:`Hohe Belastung (RPE Ø ${rp.toFixed(1)}) → Umfang der nächsten 14 Tage −15 %.`};
 else if(c<.8)AD={f:.9,msg:`Nur ${Math.round(c*100)} % des Plan-Umfangs der letzten 14 Tage geschafft → nächste 14 Tage −10 %.`};
 else AD={f:1,msg:`Plan wird gut umgesetzt (${Math.round(c*100)} % Umfang) – keine Anpassung nötig.`}}
function plan(d,na){
 if(d<START)return null;const rd=parse(S.race);if(d>rd)return null;
 const w=wtr(d),dw=(d.getDay()+6)%7,z=Z(d),r=fp;
 if(iso(d)==S.race)return{t:'race',lab:'MARATHON',km:42.2,d:`Renntag! Ziel ${ft(S.goal)} (${r(gp())}/km). Erste 10 km kontrolliert bei ca. ${r(gp()*1.02)}/km.`};
 let V=vol(w);if(w>5&&w<47&&w!=21&&w!=20&&(49-w)%4==3)V*=.78;
 if(!na&&d>=today&&d<=addD(today,13))V*=AD.f;
 const rest={t:'rest',lab:'Recovery',km:0,d:'Ruhetag. Optional 15 min Mobility.'};
 const str=(dw==2||dw==4)&&w<=47?'Kraft zu Hause 20–25 min: einbeinige Kniebeuge, Hip Thrust, Wadenheben, Plank':'';
 const easy=(k,x)=>({t:'easy',lab:'Locker',km:k,str,d:`${k} km locker @ ${r(z.e1)}–${r(z.e2)} /km${x||''}${V>=100&&k>=14?' · Doppeleinheit möglich (AM/PM)':''}`});
 if(dw==0)return rest;
 if(w>=49){if(dw==2||dw==4)return easy(6);if(dw==6)return{t:'long',lab:'Locker',km:8,d:'8 km ganz locker, Regenerationswoche.'};return rest}
 let L=V<30?Math.round(V*.25):Math.min(34,Math.round(V*.285));
 if(w==3)L=24;if(w==2)L=18;if(w==1)L=14;
 const km=dw==6?L:Math.round(Math.max(0,V-L)*[0,.21,.24,.22,.16,.17][dw]);
 const Q=(l,k,t)=>({t:'q',lab:l,km:k,str,d:`${k} km gesamt: ${t}`});
 if(dw==2||dw==5)return easy(km);
 if(dw==4)return easy(km,' + 6 × 20 s Steigerungsläufe');
 if(dw==1||dw==3){const a=dw==1;
  if(w>=48||w==20)return easy(km);
  if(w>=38)return a?Q('Hügel',km,'locker, davon 8 × 60 s bergauf kräftig (Trabpause)'):Q('Fahrtspiel',km,`6 × 2 min zügig (${r(z.t)}), je 2 min locker`);
  if(w>=30){const n=6+(37-w)%3;return a?Q('Intervalle',km,`Einlaufen + ${n} × 1000 m @ ${r(z.i)} (90 s Pause)`):Q('Tempo',km,`20 min @ ${r(z.t)} (Schwelle) im Lauf`)}
  if(w>=21)return a?Q('Schwelle',km,`4 × 2 km @ ${r(z.t)} (2 min Pause)`):Q('Tempo-DL',km,`${Math.min(km-4,8+29-w,14)} km @ ${r(z.t)}`);
  if(w>=17)return a?Q('Intervalle',km,`5 × 1000 m @ ${r(z.i)} (90 s Pause)`):Q('Tempo-DL',km,`${Math.min(10,km-4)} km @ ${r(z.t)}`);

  const m=[adj.mode=='plan'?p.d+'.':k+' km locker bei '+e+' (ca. '+min+' min), ohne Tempoabschnitte.','Die ersten 3 km bewusst langsam: Das Tempo kommt später von allein.'];
  if(k>=18)m.push('Ab Minute 40 alle 20–25 min 25–30 g Kohlenhydrate (Gel oder Iso-Getränk), zwischendurch alle 15–20 min ein paar Schlucke Wasser.');
  if(adj.mode=='plan'&&/MRT/.test(p.lab))m.push('Marathontempo-Abschnitte exakt halten, nicht schneller. Fühlt sich das Tempo ungewohnt schwer an, ist das ein Warnsignal.');
  if(adj.mode!='plan')m.push(adj.note);
  o.push({h:'Hauptteil',i:m});
  o.push({h:'Auslaufen',i:['10 min gehen oder sehr locker traben, danach die Beine 10 min hochlegen.']});
  o.push({h:'Nach dem Training',i:['Innerhalb von 30 min: 25–30 g Eiweiß plus ca. 1 g Kohlenhydrate pro kg Körpergewicht.','500–750 ml Wasser, gern mit Elektrolyten.','Abends salzig und kohlenhydratreich essen, früh schlafen.']});return o}
 const mar=p.lab=='MARATHON';
 o.push({h:'Vorher',i:['Frühstück 3 h vorher, nur Bewährtes. Nichts Neues.','Schuhe und Startnummer am Vorabend bereitlegen.']});
 o.push({h:'Aufwärmen',i:['15–20 min locker einlaufen.','Lauf-ABC 2 × 20 m, dann 4 × 80–100 m Steigerung.','Die letzten 5 min vor dem Start gehen und trinken.']});
 o.push({h:'Rennen',i:[p.d,mar?'Km 1–10 kontrolliert (5 s/km langsamer als Zielpace ist okay), Km 10–30 gleichmäßig, ab Km 30 geben, was übrig ist. Gel alle 5 km, an jeder Station trinken.':'Erste 2 km nicht schneller als Zielpace, ab Km 5 dranbleiben, ab Km 8 Gas geben.']});
 o.push({h:'Danach',i:['10–15 min auslaufen, dann essen und trinken.','Ergebnis unter „Leistung“ eintragen, damit sich deine Paces anpassen.']});
 return o}

function tip(n){if(!n)return'';return({q:'Morgen steht Qualität an: abends Kohlenhydrate essen und früh schlafen.',long:'Morgen ist Longrun: abends Nudeln oder Reis, Gels und Sachen bereitlegen, kein Alkohol.',easy:'Morgen locker: Laufsachen rauslegen.',rest:'Morgen ist frei.',race:'Morgen Wettkampf: früh ins Bett, nichts Neues essen.'})[n.t]||''}

function acts(p,adj,z,nx){
 const e=fp(z.e1)+'–'+fp(z.e2)+' /km',k=adj.km;let a1,a2;
 const kind=(adj.mode=='swap'&&p.t=='q')?'easy':p.t;
 if(p.t=='rest'||adj.mode=='rest'){a1=p.t=='rest'?'Kein Lauf. 20–30 min Spaziergang und 10 min Mobility (Hüftbeuger, Waden, Gesäß).':'Kein Lauf. Entlasten, 20–30 min gehen, nichts erzwingen.';a2='Eiweiß auf 3–4 Mahlzeiten verteilen, Kohlenhydrate normal essen, 2–3 l trinken.'}
 else if(adj.mode=='move'){a1='Testlauf verschieben. Heute 20–30 min locker oder frei.';a2='Normal essen, gut trinken.'}
 else{
  if(kind=='easy')a1=k+' km '+(adj.mode=='swap'?'sehr locker':'locker')+' bei '+e+'.';
  else if(kind=='q')a1=p.lab+': '+strip(p)+(adj.mode=='reduced'?' (gekürzt auf ca. '+k+' km)':'')+'.';
  else if(kind=='long')a1=(adj.mode=='plan'?p.d:k+' km locker, ohne Tempoabschnitte')+'.';
  else a1=p.d;
  a2=({easy:'Vorher kleiner Snack, danach 20–30 g Eiweiß plus Kohlenhydrate.',q:'2–3 h vorher Kohlenhydrate essen, danach 20–30 g Eiweiß plus Kohlenhydrate.',long:'Abend davor Nudeln oder Reis, 2–3 h vorher frühstücken, unterwegs 30–60 g Kohlenhydrate pro Stunde.',race:'Frühstück 3 h vorher, nur Bewährtes.'})[kind]}
 const rest=(p.t=='rest'||adj.mode=='rest'||adj.mode=='move');
 const a3=((nx?tip(nx)+' ':'')+'Heute 8 h Schlaf einplanen'+(rest?'.':' und abends 5–10 min Mobility.')).trim();
 return [['Training',a1],['Essen & Trinken',a2],['Abend & Schlaf',a3]]}

function rToday(){
 const el=$('#today'),k0=iso(today),p=plan(today),w=wtr(today),f=fitP(),ws=mon(today),hr=now.getHours();
 const gr=hr<11?'Guten Morgen':hr<18?'Guten Tag':'Guten Abend';
 const ds=today.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
 let pl=0,ac=0;for(let i=0;i<7;i++){const d=addD(ws,i),q=plan(d),l=S.log[iso(d)];if(q)pl+=q.km;if(l&&l.done)ac+=+l.km||0}
 const z=Z(today),days=Math.round((parse(S.race)-today)/D);
 const stats='<div class="stats"><div class="st"><span>Marathon-Prognose</span><b>'+ft(f?f.p*42.195:S.base)+'</b><span>'+(f?'aus Ergebnis '+f.d:'Ausgangswert')+'</span></div><div class="st"><span>Trainings-Marathontempo</span><b>'+fp(z.mp)+'/km</b><span>Ziel '+fp(gp())+'/km ('+ft(S.goal)+')</span></div><div class="st"><span>Diese Woche</span><b>'+Math.round(ac)+' / '+Math.round(pl)+' km</b><span>gelaufen / geplant</span></div><div class="st"><span>Phase</span><b>'+(days<0?'–':ph(w))+'</b><span>Wochen bis Rennwoche: '+Math.max(0,w)+'</span></div></div>';
 let course='';if(f){const diff=f.p*42.195-expP(today)*42.195;course=diff<=0?' Prognose liegt '+fp(-diff)+' min vor dem Plan-Verlauf.':' Prognose liegt '+fp(diff)+' min hinter dem Plan-Verlauf'+(diff>600?' – ein Zwischenziel (z. B. 2:50) wäre realistischer':'')+'.'}
 const ck=S.chk[k0]||{};
 const chips=(key,arr)=>arr.map(a=>'<button class="chip '+(ck[key]==a[0]?'on':'')+'" data-k="'+key+'" data-v="'+a[0]+'">'+a[1]+'</button>').join('');
 const checkin='<div class="card"><h3>Wie fühlst du dich heute?</h3><small>Dein Briefing passt sich sofort an.</small><div class="cr"><span>Energie</span>'+chips('en',[[1,'Müde'],[2,'Okay'],[3,'Frisch']])+'</div><div class="cr"><span>Beine</span>'+chips('leg',[[1,'Schwer'],[2,'Normal'],[3,'Leicht']])+'</div><div class="cr"><span>Schmerz</span>'+chips('pain',[[0,'Keiner'],[1,'Leicht'],[2,'Deutlich']])+'</div><div class="cr"><span>Schlaf</span>'+chips('sleep',[[5.5,'&lt; 6 h'],[6.5,'6–7 h'],[7.5,'7–8 h'],[8.5,'&gt; 8 h']])+'</div></div>';
 const wire=()=>{
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=S.chk[k0]||(S.chk[k0]={}),kk=b.dataset.k,v=+b.dataset.v;if(c[kk]===v)delete c[kk];else c[kk]=v;save();render()});
  const hl=$('#hlog');if(hl)hl.onclick=()=>openM(k0);
  el.querySelectorAll('.wp').forEach(b=>b.onclick=()=>openM(b.dataset.d))};
 if(!p){
  const msg=today<START?{t:'Dein Plan startet bald',s:'Der erste Trainingstag ist der '+START.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'})+'.'}:{t:'Rennen geschafft',s:'Gönn dir Erholung: 1–2 Wochen nur locker oder frei. Danach legst du unter „Einstellungen“ ein neues Renndatum fest.'};
  el.innerHTML='<section class="hero"><div class="hr1"><div><div class="gr">'+gr+'</div><div class="dt">'+ds+'</div></div></div><div class="ht">'+msg.t+'</div><div class="hs">'+msg.s+'</div></section>'+stats;wire();return}
 const R=readiness(),adj=adjust(p,R),nx=plan(addD(today,1));
 const e=fp(z.e1)+'–'+fp(z.e2)+' /km',ep=(z.e1+z.e2)/2,min=Math.round(adj.km*ep/60);
 const lg=S.log[k0],done=!!(lg&&lg.done);
 const lvl=p.t=='rest'?{t:'Erholung',c:'s-g'}:LV[R.lvl];
 let title,sub;
 if(p.t=='rest'){title='Recovery-Tag';sub='Heute zählt Erholung: Mobility, Essen, Schlaf.'}
 else if(adj.mode=='rest'||adj.mode=='move'){title=adj.title;sub=adj.mode=='move'?'Locker 20–30 min oder frei.':'Heute kein Lauftraining.'}
 else if(adj.mode=='swap'){title=p.t=='q'?'Locker statt '+p.lab+' · '+adj.km+' km':'Kurz & locker · '+adj.km+' km';sub='ca. '+min+' min bei '+e}
 else{title=p.t=='race'?p.lab:p.lab+' · '+adj.km+' km'+(adj.mode=='reduced'?' (gekürzt)':'');sub=p.t=='q'?strip(p):p.t=='easy'?'ca. '+min+' min · '+e:p.d}
 const orig=(adj.mode!='plan'&&p.t!='rest')?p.lab+(p.km?' · '+r1(p.km)+' km':''):'';
 const pace=(lg&&+lg.km>0&&+lg.min>0)?' · Ø '+fp(lg.min*60/lg.km)+' /km':'';
 const hero='<section class="hero"><div class="hr1"><div><div class="gr">'+gr+'</div><div class="dt">'+ds+'</div></div><span class="pill '+lvl.c+'"><i></i>'+lvl.t+'</span></div><div class="ht">'+title+'</div><div class="hs">'+sub+'</div>'+(orig?'<div class="ho">Plan war: <s>'+orig+'</s></div>':'')+(adj.note?'<div class="hn">'+adj.note+'</div>':'')+(done?'<div class="hdone">✓ Erledigt: '+esc(lg.km)+' km'+(lg.min?' in '+esc(lg.min)+' min':'')+pace+'</div>':'')+'<div class="b"><button class="vb" id="hlog">'+(done?'Eintrag bearbeiten':'Lauf eintragen')+'</button></div></section>';
 const steps='<div class="card"><h3>Deine 3 Schritte heute</h3>'+acts(p,adj,z,nx).map((a,i)=>'<div class="stp"><div class="n">'+(i+1)+'</div><div><b>'+a[0]+'</b>'+a[1]+'</div></div>').join('')+'</div>';
 const detail='<details class="card" '+(done?'':'open')+'><summary><h3>Ablauf &amp; Hinweise</h3></summary>'+sess(p,adj,z).map(s=>'<div class="sec"><div class="sh">'+s.h+'</div><ul>'+s.i.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>').join('')+'</details>';
 const m=R.m,t3=(v,l,s)=>'<div class="tl"><b>'+v+'</b><span>'+l+(s?'<br>'+s:'')+'</span></div>';
 const tiles='<div class="tiles">'+t3(Math.round(m.acute||0)+' km','Letzte 7 Tage','gelaufen')+t3(m.rpe!=null?m.rpe.toFixed(1):'–','RPE Ø','letzte 3 Läufe')+t3(m.streak||0,'Lauftage am Stück','bis gestern')+t3(m.sleep!=null?r1(m.sleep)+' h':'–','Schlaf',m.sleepSrc||'im Check-in angeben')+t3(m.rhr?Math.round(m.rhr):'–','Ruhepuls',m.rhrB?'Ø '+Math.round(m.rhrB):'mit Intervals-Daten')+t3(m.form!=null?Math.round(m.form):'–','Form (CTL−ATL)','Intervals.icu')+'</div>';
 const state='<div class="card"><h3>Dein Zustand</h3>'+tiles+R.why.map(x=>'<div class="ln w">'+x+'</div>').join('')+R.good.map(x=>'<div class="ln o">'+x+'</div>').join('')+'<div class="ln" style="margin-top:10px;color:var(--mu)">🔄 '+AD.msg+course+'</div></div>';
 let wk='';for(let i=0;i<7;i++){const d=addD(ws,i),q=plan(d),l=S.log[iso(d)],dn=l&&l.done;wk+='<div class="wp '+(q?'t-'+q.t:'')+' '+(dn?'dn':'')+' '+(+d==+today?'tod':'')+'" data-d="'+iso(d)+'"><b>'+DOW[i]+'</b>'+(q?(q.km?Math.round(q.km)+' km':'frei'):'–')+(dn?'<div class="ck">✓ '+Math.round(+l.km||0)+'</div>':'')+'</div>'}
 const week='<div class="card"><h3>Diese Woche'+(deload(w)?'<span class="tag">Entlastungswoche</span>':'')+'</h3><div class="wk">'+wk+'</div><div class="bar"><i style="width:'+Math.min(100,pl?ac/pl*100:0)+'%;background:var(--ok)"></i></div><small>'+Math.round(ac)+' von '+Math.round(pl)+' km</small></div>';
 const nxt=[1,2,3].map(i=>{const d=addD(today,i),q=plan(d);return q?'<div class="nr"><b>'+DOW[(d.getDay()+6)%7]+' '+d.getDate()+'.</b><span class="dot t-'+q.t+'"></span>'+q.lab+(q.km?' · '+r1(q.km)+' km':'')+'</div>':''}).join('');
 const next='<div class="card"><h3>Als Nächstes</h3>'+nxt+(nx?'<small style="display:block;margin-top:6px">'+tip(nx)+'</small>':'')+'</div>';
 const focus='<div class="card"><h3>Fokus: '+ph(w)+'</h3><div>'+(FOCUS[ph(w)]||'')+'</div></div>';
 el.innerHTML=hero+checkin+steps+detail+state+week+next+focus+stats;wire()}

function render(){
 const y=window.scrollY;
 calcAd();
 const days=Math.round((parse(S.race)-today)/D);
 $('#cd').innerHTML=days>=0?'Rennen in <b>'+days+'</b> Tagen · '+Math.floor(days/7)+' Wochen':'Rennen vorbei';
 rToday();rCal();rPerf();rSet();
 window.scrollTo(0,y)}
function showTab(t){document.querySelectorAll('nav.bar button').forEach(x=>x.classList.toggle('on',x.dataset.t==t));['today','cal','perf','set'].forEach(id=>$('#'+id).hidden=id!=t);window.scrollTo(0,0)}
document.querySelectorAll('nav.bar button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
render();

async function icuSync(){
 if(!ICU.id||!ICU.key){setSync('Intervals.icu verbinden →');return}
 setSync('⏳ lädt Läufe…');
 try{
  const base='https://intervals.icu/api/v1/athlete/'+encodeURIComponent(ICU.id),hd={Authorization:'Basic '+btoa('API_KEY:'+ICU.key)};
  const r=await fetch(base+'/activities?oldest='+iso(START)+'&newest='+iso(today),{headers:hd});
  if(r.status==401||r.status==403)throw new Error('Zugang abgelehnt (ID/Schlüssel prüfen)');
  if(!r.ok)throw new Error('Fehler '+r.status);
  const acts=await r.json(),by={};
  for(const a of acts){if(!/Run/.test(a.type||''))continue;const k=(a.start_date_local||'').slice(0,10);if(!k)continue;
   const b=by[k]||(by[k]={km:0,min:0,rpe:0});b.km+=(a.distance||0)/1000;b.min+=(a.moving_time||0)/60;b.rpe=Math.max(b.rpe,a.icu_rpe||0)}
  let n=0;
  for(const k in by){const o=S.log[k]||{},b=by[k];S.log[k]={done:true,km:r1(b.km),min:Math.round(b.min),rpe:o.rpe||(b.rpe?String(b.rpe):''),note:o.note||'Intervals.icu'};n++}
  try{const wr=await fetch(base+'/wellness?oldest='+iso(addD(today,-28))+'&newest='+iso(today),{headers:hd});
   if(wr.ok){const arr=await wr.json(),W={};for(const x of arr){const id=String(x.id||'').slice(0,10);if(!id)continue;W[id]={rhr:x.restingHR||null,hrv:x.hrv||null,sleep:x.sleepSecs?x.sleepSecs/3600:null,ctl:x.ctl!=null?x.ctl:null,atl:x.atl!=null?x.atl:null}}S.well=W}}catch(e){}
  save();render();setSync('✅ '+n+' Lauftage synchronisiert · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSync('⚠️ '+(e.message||'Sync fehlgeschlagen'))}}
$('#sy').onclick=()=>{if(!ICU.id||!ICU.key)showTab('set');else icuSync()};
const DAY0=iso(new Date());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(iso(new Date())!==DAY0){location.reload();return}icuSync()}});
icuSync();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
