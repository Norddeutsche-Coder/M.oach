<script>

const D=864e5,A=[[49,15],[48,35],[47,50],[40,70],[37,66],[29,78],[22,90],[21,86],[20,70],[16,90],[5,120],[3,96],[2,72],[1,50],[0,45]];
const START=new Date(2026,9,12),$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),mon=d=>addD(d,-((d.getDay()+6)%7));
const fp=s=>{s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
const ft=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=x=>Math.round(x*10)/10;
const DEF=()=>({race:'2027-09-26',goal:9900,base:11400,res:[],log:{},chk:{},well:{},prof:{}});let S=DEF();
try{const x=localStorage.getItem('mplan2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
let ICU={id:'',key:''};
try{const x=localStorage.getItem('mplan_icu');if(x)ICU=JSON.parse(x)}catch(e){}
const setSync=t=>{const e=$('#sy');if(e)e.textContent=t;const f=$('#icust');if(f)f.textContent=t};
const store=()=>{try{localStorage.setItem('mplan2',JSON.stringify(S))}catch(e){}};
const save=()=>store();
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const wtr=d=>Math.round((mon(parse(S.race))-mon(d))/(7*D));
const ph=w=>w>=48?'Regeneration':w>=38?'Grundlagen':w>=30?'Tempoentwicklung':w>=21?'Schwelle & Test':w>=17?'Entlastung + Basis':w>=4?'Marathonspezifisch':'Tapering';
function vol(w){if(w>=49)return 15;if(w<=0)return 45;for(let i=0;i<A.length-1;i++){const[a,x]=A[i],[b,y]=A[i+1];if(w<=a&&w>=b)return a==b?x:y+(x-y)*(w-b)/(a-b)}return 45}
const gp=()=>S.goal/42.195;
function expP(d){const b=S.base/42.195,e=addD(mon(parse(S.race)),-35),f=Math.max(0,Math.min(1,(d-START)/(e-START)));return b+(gp()-b)*f}
function fitP(){let b=null;for(const r of S.res){const p=r.sec*Math.pow(42.195/r.km,1.06)/42.195;if(!b||r.d>=b.d)b={d:r.d,p,r}}return b}
function Z(d){const f=fitP();let P=f?f.p:expP(d);P=Math.max(P,gp());return{mp:P,e1:P*1.16,e2:P*1.3,t:P*.945,i:P*.91,r:P*.87}}
let AD={f:1,msg:'Noch zu wenig Daten – trage deine Läufe ein, dann passt sich der Plan an.'};
function calcAd(){let pl=0,ac=0,rs=[],n=0;AD={f:1,msg:AD.msg};
 for(let i=1;i<=14;i++){const d=addD(today,-i);if(d<START)break;const p=plan(d,1),l=S.log[iso(d)];if(p&&p.km)pl+=p.km;if(l&&l.done){n++;ac+=+l.km||0;if(l.rpe&&i<=7)rs.push(+l.rpe)}}
 if(n<3||pl<20){AD={f:1,msg:'Noch zu wenig Daten – trage mindestens 3 Läufe ein, dann passt sich der Plan an.'};return}

 const ck=S.chk[iso(today)]||{},W=S.well||{},wl=W[iso(today)]||{};
 if(ck.pain==2){R.pts+=4;R.pain=2;R.why.push('Du meldest deutliche Schmerzen.')}
 else if(ck.pain==1){R.pts+=2;R.pain=1;R.why.push('Leichtes Ziehen oder Schmerz gemeldet.')}

 if(sl!=null){if(sl<5.5){R.pts+=2;R.why.push('Nur ca. '+r1(sl)+' h Schlaf.')}else if(sl<6.5){R.pts+=1;R.why.push('Eher kurze Nacht (ca. '+r1(sl)+' h).')}else if(sl>=7.5)R.good.push('Gut geschlafen (ca. '+r1(sl)+' h).')}
 const others=Object.keys(W).filter(k=>k!==iso(today)).map(k=>W[k]);
 const avg=f=>{const v=others.map(o=>o[f]).filter(x=>x>0);return v.length>=4?v.reduce((a,b)=>a+b)/v.length:null};
 const rb=avg('rhr'),hb=avg('hrv');
 if(wl.rhr>0){R.m.rhr=wl.rhr;R.m.rhrB=rb;if(rb&&wl.rhr-rb>=8){R.pts+=2;R.why.push('Ruhepuls '+Math.round(wl.rhr)+' (sonst Ø '+Math.round(rb)+').')}else if(rb&&wl.rhr-rb>=5){R.pts+=1;R.why.push('Ruhepuls erhöht: '+Math.round(wl.rhr)+' (sonst Ø '+Math.round(rb)+').')}}

 else if(adj.mode=='swap'){title=p.t=='q'?'Locker statt '+p.lab+' · '+adj.km+' km':'Kurz & locker · '+adj.km+' km';sub='ca. '+min+' min bei '+e}
 else{title=p.t=='race'?p.lab:p.lab+' · '+adj.km+' km'+(adj.mode=='reduced'?' (gekürzt)':'');sub=p.t=='q'?strip(p):p.t=='easy'?'ca. '+min+' min · '+e:p.d}
 const orig=(adj.mode!='plan'&&p.t!='rest')?p.lab+(p.km?' · '+r1(p.km)+' km':''):'';
 const pace=(lg&&+lg.km>0&&+lg.min>0)?' · Ø '+fp(lg.min*60/lg.km)+' /km':'';
 const hero='<section class="hero"><div class="hr1"><div><div class="gr">'+gr+'</div><div class="dt">'+ds+'</div></div><span class="pill '+lvl.c+'"><i></i>'+lvl.t+'</span></div><div class="ht">'+title+'</div><div class="hs">'+sub+'</div>'+(orig?'<div class="ho">Plan war: <s>'+orig+'</s></div>':'')+(adj.note?'<div class="hn">'+adj.note+'</div>':'')+(done?'<div class="hdone">✓ Erledigt: '+esc(lg.km)+' km'+(lg.min?' in '+esc(lg.min)+' min':'')+pace+'</div>':'')+'</section>';
 let nxw=0;for(let i=0;i<7;i++){const q=plan(addD(ws,7+i),1);if(q)nxw+=q.km}
 const weekRows=[0,1,2,3,4,5,6].map(i=>{const d=addD(ws,i),q=plan(d),l=S.log[iso(d)],dn=l&&l.done;
  const lab=!q?'–':q.t=='rest'?'Recovery / frei':q.lab+(q.km?' · '+r1(q.km)+' km':'');
  const s2=q&&(q.t=='q'||(q.t=='long'&&/MRT/.test(q.lab)))?strip(q):'';
  return '<div class="wr '+(+d==+today?'tod ':'')+(dn?'dn':'')+'" data-d="'+iso(d)+'"><div class="wd"><b>'+DOW[i]+'</b><span>'+d.getDate()+'.</span></div><span class="dot t-'+(q?q.t:'rest')+'"></span><div class="wt"><div>'+lab+'</div>'+(s2?'<small>'+s2+'</small>':'')+'</div><div class="wk2">'+(dn?'<span class="ck">✓ '+r1(+l.km||0)+' km</span>':'')+'</div></div>'}).join('');
 const week='<div class="card"><h3>Diese Woche'+(deload(w)?'<span class="tag">Entlastungswoche</span>':'')+'</h3><div class="sub">'+dshort(ws)+' – '+dshort(addD(ws,6))+' · '+Math.round(ac)+' von '+Math.round(pl)+' km</div>'+weekRows+'<div class="bar" style="margin-top:8px"><i style="width:'+Math.min(100,pl?ac/pl*100:0)+'%;background:var(--ok)"></i></div><small>Nächste Woche: '+Math.round(nxw)+' km geplant. Tippe auf einen Tag, um Details zu sehen oder einen Lauf einzutragen.</small></div>';
 let course='';if(f){const diff=f.p*42.195-expP(today)*42.195;course=diff<=0?' Prognose liegt '+fp(-diff)+' min vor dem Plan-Verlauf.':' Prognose liegt '+fp(diff)+' min hinter dem Plan-Verlauf'+(diff>600?' – ein Zwischenziel (z. B. 2:50) wäre realistischer':'')+'.'}
 const trs=trends(R);
 const connRow=ICU.key?'':'<div class="tips">Mit Intervals.icu siehst du hier Ruhepuls-, HRV-, Schlaf- und Fitness-Trends, und deine Läufe kommen automatisch.<div class="b"><button class="pri goicu">Intervals.icu verbinden</button></div></div>';
 const warn=R.why.slice(0,3).map(x=>'<div class="ln w">'+x+'</div>').join('')+R.good.slice(0,1).map(x=>'<div class="ln o">'+x+'</div>').join('');
 const state='<div class="card"><h3>Dein Zustand</h3><div class="sub">Trends der letzten Wochen'+(ICU.key?' · Daten aus Intervals.icu':'')+'</div>'+(trs||'<div class="mu" style="margin:6px 0">Noch keine Trenddaten.</div>')+connRow+'<div style="margin-top:8px">'+warn+'</div><div class="ln" style="color:var(--mu)">🔄 '+AD.msg+course+'</div>'+checkin+'</div>';
 const T=trainBlock(p,adj,z),F=foodBlock(p,adj,z,rest),N=nightBlock(p,adj,nx,rest);
 const rowsH=a=>a.map(r=>'<div class="sr"><div class="sl">'+r[0]+'</div><div class="sv">'+r[1]+'</div></div>').join('');
 const step=(n,ic,title,meta,col,body,badge)=>'<div class="card step" style="--sc:'+col+'"><div class="sh2"><div class="ib">'+IC[ic]+'</div><div class="st1"><b>'+n+' · '+title+(badge||'')+'</b><span>'+meta+'</span></div></div><div class="bd">'+body+'</div></div>';
 const steps='<h3 class="h3s">Deine 3 Schritte heute</h3>'
  +step(1,'run','Training',T.meta,'#2563eb',rowsH(T.rows)+(T.tips.length?'<div class="tips">'+T.tips.map(t=>'<div>💡 '+t+'</div>').join('')+'</div>':''),done?'<span class="tag">✓ erledigt</span>':'')
  +step(2,'food','Essen &amp; Trinken',F.meta,'#16a34a',F.html)
  +step(3,'moon','Abend &amp; Schlaf',N.meta,'#7c5cd6',rowsH(N.rows));
 el.innerHTML=hero+week+kp+why+state+steps;wire()}

function render(){
 const y=window.scrollY;
 calcAd();
 const days=Math.round((parse(S.race)-today)/D);
 $('#cd').innerHTML=days>=0?'Rennen in <b>'+days+'</b> Tagen · '+Math.floor(days/7)+' Wochen':'Rennen vorbei';
 rToday();rCal();rPerf();rSet();
 window.scrollTo(0,y)}
function showTab(t){document.querySelectorAll('nav.bar button').forEach(x=>x.classList.toggle('on',x.dataset.t==t));['today','cal','perf','set'].forEach(id=>$('#'+id).hidden=id!=t);window.scrollTo(0,0)}
document.querySelectorAll('nav.bar button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
render();

const ICU_WEEKS=12;
let icuBusy=false,icuLast=0;
const fromIcu=o=>!!o&&(o.src==='icu'||o.note==='Intervals.icu');
async function icuSync(){
 if(!ICU.key){setSync('Intervals.icu verbinden →');return}
 if(icuBusy)return;icuBusy=true;
 setSync('⏳ lädt Läufe…');
 try{
  const base='https://intervals.icu/api/v1/athlete/'+encodeURIComponent((ICU.id||'').trim()||'0'),hd={Authorization:'Basic '+btoa('API_KEY:'+ICU.key)};
  const from=iso(addD(today,-7*ICU_WEEKS)),to=iso(addD(today,1));
  let r;
  try{r=await fetch(base+'/activities?oldest='+from+'&newest='+to,{headers:hd})}
  catch(e){throw new Error(navigator.onLine===false?'Offline – Abruf folgt, sobald du online bist':'Keine Verbindung zu Intervals.icu')}
  if(r.status==401||r.status==403)throw new Error('Zugang abgelehnt: API-Schlüssel (und ggf. Athlete-ID) prüfen');
  if(!r.ok)throw new Error('Intervals.icu meldet Fehler '+r.status);
  const acts=await r.json();
  if(!Array.isArray(acts))throw new Error('Unerwartete Antwort von Intervals.icu');
  const by={};
  for(const a of acts){
   if(!/Run/.test(a.type||''))continue;
   const k=String(a.start_date_local||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;
   const b=by[k]||(by[k]={km:0,sec:0,rpe:0});
   b.km+=(+(a.icu_distance!=null?a.icu_distance:a.distance)||0)/1000;
   b.sec+=+(a.moving_time!=null?a.moving_time:a.elapsed_time)||0;
   b.rpe=Math.max(b.rpe,+(a.icu_rpe||a.perceived_exertion)||0)}
  let fresh=0;
  for(const k in by){const o=S.log[k]||{},b=by[k];if(!o.done)fresh++;
   S.log[k]={done:true,km:r1(b.km),min:Math.round(b.sec/60),rpe:o.rpe||(b.rpe?String(b.rpe):''),note:o.note||'Intervals.icu',src:'icu'}}
  if(acts.length)for(const k of Object.keys(S.log)){if(k>=from&&k<=to&&!(k in by)&&fromIcu(S.log[k]))delete S.log[k]}
  try{const wr=await fetch(base+'/wellness?oldest='+iso(addD(today,-28))+'&newest='+iso(today),{headers:hd});
   if(wr.ok){const arr=await wr.json(),W={};for(const x of arr){const id=String(x.id||'').slice(0,10);if(!id)continue;W[id]={rhr:x.restingHR||null,hrv:x.hrv||null,sleep:x.sleepSecs?x.sleepSecs/3600:null,ctl:x.ctl!=null?x.ctl:null,atl:x.atl!=null?x.atl:null}}S.well=W}}catch(e){}
  icuLast=Date.now();save();render();
  setSync('✅ '+(fresh==0?'aktuell':fresh==1?'1 neuer Lauftag':fresh+' neue Lauftage')+' · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSync('⚠️ '+(e.message||'Sync fehlgeschlagen'))}
 finally{icuBusy=false}}
$('#sy').onclick=()=>{if(!ICU.key)showTab('set');else icuSync()};
$('#pf').onclick=()=>showTab('set');
const DAY0=iso(new Date());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(iso(new Date())!==DAY0){location.reload();return}icuSync()}});
window.addEventListener('online',()=>icuSync());
setInterval(()=>{if(!document.hidden&&Date.now()-icuLast>10*60*1000)icuSync()},60000);
icuSync();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
