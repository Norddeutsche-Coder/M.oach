name: Secret-Scan

# Prüft alle Commits eines Pull Requests auf Secrets (gitleaks).
# Bei einem Fund: Warnabschnitt in der PR-Beschreibung (ohne Werte) und roter Check.
# Der Abschnitt bleibt stehen, bis ein Mensch ihn nach dem Rotieren entfernt.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check --quiet
          tar -xzf "$file" gitleaks
          ./gitleaks version

      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./gitleaks git . \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks.json \
            --exit-code 0
          echo "Funde: $(python3 -c 'import json;print(len(json.load(open("gitleaks.json")) or []))')"

      - name: Report in PR description
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const findings = JSON.parse(fs.readFileSync('gitleaks.json', 'utf8') || '[]') || []
            if (!findings.length) {
              core.info('Keine Secrets gefunden.')
              return
            }
            const start = '<!-- secret-scan:start -->'
            const end = '<!-- secret-scan:end -->'
            const rows = findings.map(f =>
              `| \`${f.RuleID}\` | ${String(f.Description || '').replace(/\|/g, '/')} | \`${f.File}:${f.StartLine}\` | \`${String(f.Commit || '').slice(0, 7)}\` |`)
            const section = [
              start,
              '## ⚠️ Secrets offengelegt – bitte rotieren',
              '',
              `Der Secret-Scan hat ${findings.length} möglichen Fund(e) in den Commits dieses PRs entdeckt. Werte werden hier nie angezeigt.`,
              '',
              '| Regel | Art | Fundort | Commit |',
              '|---|---|---|---|',
              ...rows,
              '',
              '**Was jetzt zu tun ist**',
              '1. Jedes betroffene Secret beim Anbieter **rotieren** (neu erzeugen, altes widerrufen). Löschen aus dem Code reicht nicht, es steht in der Git-Historie.',
              '2. Das Secret aus dem PR entfernen und stattdessen eine Umgebungsvariable verwenden.',
              '3. Diesen Abschnitt erst nach dem Rotieren entfernen. Ein Fehlalarm wird hier mit Begründung vermerkt.',
              '',
              `_Zuletzt geprüft: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC, Commit ${context.payload.pull_request.head.sha.slice(0, 7)}_`,
              end,
            ].join('\n')
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number })
            const body = pr.body || ''
            const pattern = new RegExp(`${start}[\\s\\S]*?${end}`)
            const next = pattern.test(body) ? body.replace(pattern, section) : `${section}\n\n${body}`
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, body: next })
            core.setFailed(`${findings.length} mögliche(s) Secret(s) gefunden. Details in der PR-Beschreibung, bitte rotieren.`)
